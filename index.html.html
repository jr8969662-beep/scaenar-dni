<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escáner DNI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --accent: #2563eb;
    --accent-light: #3b82f6;
    --success: #16a34a;
    --success-light: #22c55e;
    --text: #e6edf3;
    --text-muted: #7d8590;
    --danger: #dc2626;
    --warn: #d97706;
    --font: 'Segoe UI', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  }
  header .badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; }
  header h1 { font-size: 16px; font-weight: 600; flex: 1; }

  main { flex: 1; padding: 20px 16px; max-width: 480px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }

  /* TABS */
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; font-family: var(--font); font-weight: 500; padding: 10px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: background .15s, color .15s; }
  .tab-btn .icon { font-size: 18px; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .tab-btn:not(.active):hover { background: var(--surface2); color: var(--text); }

  /* PANELS */
  .panel { display: none; flex-direction: column; gap: 14px; }
  .panel.active { display: flex; }

  /* BARRA DE PROGRESO SESION */
  .session-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .session-bar .s-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .session-bar .s-label strong { color: var(--text); }
  .dots { display: flex; gap: 5px; flex: 1; }
  .dot {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--border);
    transition: background .2s;
  }
  .dot.filled { background: var(--success); }
  .dot.current { background: var(--accent); animation: pulse 1s infinite; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

  /* SCANNER */
  .scanner-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  #reader { width: 100%; }
  #reader video { border-radius: 0 !important; }

  .scan-hint { text-align: center; color: var(--text-muted); font-size: 13px; padding: 8px; }

  /* LISTA SESION */
  .session-list { display: flex; flex-direction: column; gap: 8px; }

  .session-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--success);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .session-item .si-num {
    background: var(--success);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .session-item .si-info { flex: 1; min-width: 0; }
  .session-item .si-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-item .si-dni { font-size: 11px; color: var(--text-muted); }
  .session-item .si-del { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 2px 6px; flex-shrink: 0; }
  .session-item .si-del:hover { color: var(--danger); }

  /* BOTONES */
  .btn { width: 100%; padding: 13px; border-radius: 10px; border: none; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity .15s, transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-light); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-success { background: var(--success); color: #fff; }
  .btn-warn { background: var(--warn); color: #fff; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover { background: var(--surface2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .action-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

  /* MANUAL FORM */
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .form-group input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: var(--font); font-size: 15px; padding: 10px 12px; width: 100%; outline: none; transition: border-color .15s; }
  .form-group input:focus { border-color: var(--accent-light); }
  .form-group input::placeholder { color: var(--text-muted); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* SAVED LIST */
  .saved-list { display: flex; flex-direction: column; gap: 10px; }
  .saved-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .saved-item .s-name { font-size: 14px; font-weight: 600; }
  .saved-item .s-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; }
  .saved-item .s-actions { display: flex; gap: 8px; margin-top: 6px; }
  .mini-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: var(--font); font-size: 11px; font-weight: 600; padding: 4px 10px; cursor: pointer; }
  .mini-btn:hover { background: var(--border); }
  .mini-btn.del { color: var(--danger); }

  .empty-state { text-align: center; color: var(--text-muted); font-size: 14px; padding: 30px 0; }
  .empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }

  /* TOAST */
  .toast { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 500; white-space: nowrap; z-index: 100; transition: transform .25s ease; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* SECCION TITULO */
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-muted); }

  /* qrcode lib override */
  #reader__scan_region { background: transparent !important; }
  #reader__dashboard { background: var(--surface) !important; color: var(--text-muted) !important; border-top: 1px solid var(--border) !important; }
  #reader__dashboard_section_swaplink { color: var(--accent-light) !important; }
</style>
</head>
<body>

<header>
  <span class="badge">DNI AR</span>
  <h1>Escáner de Documentos</h1>
</header>

<main>
  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('scan')" id="tab-scan">
      <span class="icon">📷</span>
      Escanear QR
    </button>
    <button class="tab-btn" onclick="switchTab('manual')" id="tab-manual">
      <span class="icon">✏️</span>
      Manual
    </button>
    <button class="tab-btn" onclick="switchTab('saved')" id="tab-saved">
      <span class="icon">📋</span>
      Guardados
    </button>
  </div>

  <!-- PANEL SCAN -->
  <div class="panel active" id="panel-scan">

    <!-- Barra de sesión -->
    <div class="session-bar" id="session-bar" style="display:none">
      <div class="s-label">DNI <strong id="s-count">0</strong> / 8</div>
      <div class="dots" id="s-dots"></div>
    </div>

    <!-- Cámara -->
    <div class="scanner-box">
      <div id="reader"></div>
    </div>
    <p class="scan-hint" id="scan-hint">Iniciá la sesión para escanear hasta 8 DNI seguidos</p>

    <!-- Controles cámara -->
    <div id="cam-controls">
      <button class="btn btn-primary" id="btn-start" onclick="startSesion()">Iniciar sesión de escaneo</button>
      <button class="btn btn-danger" id="btn-stop" onclick="pausarCamara()" style="display:none">Pausar cámara</button>
      <button class="btn btn-primary" id="btn-resume" onclick="reanudarCamara()" style="display:none">Continuar escaneando</button>
    </div>

    <!-- Lista de DNI escaneados en esta sesión -->
    <div id="session-section" style="display:none">
      <p class="section-title" style="margin-bottom:8px">DNI escaneados en esta sesión</p>
      <div class="session-list" id="session-list"></div>
      <div class="action-row-3" style="margin-top:4px">
        <button class="btn btn-success" onclick="guardarSesion()">Guardar todos</button>
        <button class="btn btn-outline" onclick="copiarSesion()">Copiar todos</button>
        <button class="btn btn-danger" onclick="limpiarSesion()" style="font-size:12px">Limpiar</button>
      </div>
    </div>

  </div>

  <!-- PANEL MANUAL -->
  <div class="panel" id="panel-manual">
    <div class="form-group">
      <label>Apellido</label>
      <input type="text" id="m-apellido" placeholder="GARCIA" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="m-nombre" placeholder="JUAN PABLO" autocomplete="off">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>N° DNI</label>
        <input type="text" id="m-dni" placeholder="12345678" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>Sexo</label>
        <input type="text" id="m-sexo" placeholder="M / F" maxlength="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Fecha Nacimiento</label>
        <input type="text" id="m-nac" placeholder="01/01/1990">
      </div>
      <div class="form-group">
        <label>Vencimiento</label>
        <input type="text" id="m-venc" placeholder="01/01/2030">
      </div>
    </div>
    <div class="form-group">
      <label>Ejemplar / Trámite</label>
      <input type="text" id="m-ejemplar" placeholder="00001" autocomplete="off">
    </div>
    <button class="btn btn-primary" onclick="guardarManual()">Agregar a sesión</button>
  </div>

  <!-- PANEL SAVED -->
  <div class="panel" id="panel-saved">
    <div class="action-row">
      <button class="btn btn-outline" onclick="exportarTodos()">Exportar todo</button>
      <button class="btn btn-danger" onclick="borrarTodos()" style="font-size:13px">Borrar todo</button>
    </div>
    <div class="saved-list" id="saved-list"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const MAX_DNI = 8;
let html5QrCode = null;
let scanning = false;
let sesionActiva = false;
let sesionDNI = []; // DNI de la sesión actual (no guardados aún)
let cooldown = false; // evitar doble lectura

// ── PARSEO DNI ARGENTINO (QR y PDF417) ───────────────────
function parsearDNI(texto) {
  // Intentar QR primero (separado por @)
  const resQR = parsearQR(texto);
  if (resQR) return resQR;

  // Intentar PDF417 (DNI viejo, separado por @ pero distinto orden)
  const resPDF = parsearPDF417(texto);
  if (resPDF) return resPDF;

  return null;
}

function parsearQR(texto) {
  // Formato QR nuevo: @APELLIDO@NOMBRE@SEXO@DNI@EJEMPLAR@NACIMIENTO@VENCIMIENTO@...
  const raw = texto.startsWith('@') ? texto.substring(1) : texto;
  const p = raw.split('@');
  if (p.length < 7) return null;
  // Validar que tenga algo parecido a un DNI (números)
  const posibleDNI = limpiar(p[4] || p[3]);
  if (!/^\d{6,8}$/.test(posibleDNI.replace(/\./g,''))) return null;
  return {
    apellido:    limpiar(p[1] || p[0]),
    nombre:      limpiar(p[2] || p[1]),
    sexo:        limpiar(p[3] || ''),
    dni:         posibleDNI.replace(/\./g,''),
    ejemplar:    limpiar(p[5] || ''),
    nacimiento:  limpiar(p[6] || ''),
    vencimiento: limpiar(p[7] || ''),
    fuente: 'QR',
    ts: new Date().toISOString()
  };
}

function parsearPDF417(texto) {
  // Formato PDF417 DNI argentino viejo:
  // APELLIDO@NOMBRE@DNI@SEXO@NACIMIENTO@...
  // o separado por espacios / tabulaciones en algunos modelos
  let p = null;
  if (texto.includes('@')) {
    p = texto.split('@');
  } else if (texto.includes('\t')) {
    p = texto.split('\t');
  }
  if (!p || p.length < 5) return null;

  // Buscar campo que parezca DNI (6-8 dígitos)
  let dniIdx = p.findIndex(x => /^\d{6,8}$/.test(x.trim().replace(/\./g,'')));
  if (dniIdx === -1) return null;

  // Heurística de posición para PDF417 viejo
  return {
    apellido:    limpiar(p[0] || ''),
    nombre:      limpiar(p[1] || ''),
    dni:         limpiar(p[dniIdx]).replace(/\./g,''),
    sexo:        limpiar(p[dniIdx + 1] || ''),
    nacimiento:  limpiar(p[dniIdx + 2] || ''),
    vencimiento: limpiar(p[dniIdx + 3] || ''),
    ejemplar:    limpiar(p[dniIdx + 4] || ''),
    fuente: 'PDF417',
    ts: new Date().toISOString()
  };
}

function limpiar(str) { return (str||'').trim().replace(/\s+/g,' '); }

// ── SESION ────────────────────────────────────────────────
function startSesion() {
  sesionDNI = [];
  sesionActiva = true;
  renderSessionBar();
  document.getElementById('session-bar').style.display = 'flex';
  document.getElementById('session-section').style.display = 'none';
  iniciarCamara();
}

function iniciarCamara() {
  if (html5QrCode) {
    html5QrCode.clear();
    html5QrCode = null;
  }
  html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 };

  Html5Qrcode.getCameras().then(cams => {
    const cam = cams.find(c => /back|rear|environment/i.test(c.label)) || cams[cams.length - 1];
    return html5QrCode.start(
      { deviceId: { exact: cam.id } },
      { ...config, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.PDF_417 ] },
      onQRSuccess, () => {}
    );
  }).catch(() => {
    html5QrCode.start(
      { facingMode: "environment" },
      { ...config, formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.PDF_417 ] },
      onQRSuccess, () => {}
    );
  });

  document.getElementById('btn-start').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'block';
  document.getElementById('btn-resume').style.display = 'none';
  scanning = true;
  actualizarHint();
}

function pausarCamara() {
  if (html5QrCode && scanning) {
    html5QrCode.stop().then(() => {
      scanning = false;
      document.getElementById('btn-stop').style.display = 'none';
      document.getElementById('btn-resume').style.display = 'block';
    });
  }
}

function reanudarCamara() {
  if (sesionDNI.length >= MAX_DNI) {
    toast(`Límite de ${MAX_DNI} DNI alcanzado`);
    return;
  }
  iniciarCamara();
}

function onQRSuccess(decodedText) {
  if (cooldown) return;

  // Evitar duplicado en la misma sesión
  const datos = parsearDNI(decodedText);
  if (!datos) { toast('Código no reconocido como DNI'); return; }

  const yaExiste = sesionDNI.some(d => d.dni === datos.dni);
  if (yaExiste) {
    toast(`DNI ${datos.dni} ya fue escaneado`);
    return;
  }

  // Cooldown 2s para no leer el mismo QR varias veces
  cooldown = true;
  setTimeout(() => { cooldown = false; }, 2000);

  sesionDNI.push(datos);
  renderSessionBar();
  renderSessionList();

  document.getElementById('session-section').style.display = 'block';

  if (sesionDNI.length >= MAX_DNI) {
    pausarCamara();
    toast(`✅ ${MAX_DNI} DNI completados`);
    document.getElementById('btn-resume').style.display = 'none';
    actualizarHint();
  } else {
    toast(`DNI ${sesionDNI.length} de ${MAX_DNI} leído`);
    actualizarHint();
  }
}

function actualizarHint() {
  const h = document.getElementById('scan-hint');
  if (!sesionActiva) {
    h.textContent = 'Iniciá la sesión para escanear QR o código de barras de hasta 8 DNI';
  } else if (sesionDNI.length >= MAX_DNI) {
    h.textContent = `Límite de ${MAX_DNI} DNI alcanzado. Guardá o copiá los datos.`;
  } else {
    h.textContent = `Apuntá al QR o código de barras del DNI. Próximo: ${sesionDNI.length + 1} de ${MAX_DNI}`;
  }
}

function renderSessionBar() {
  document.getElementById('s-count').textContent = sesionDNI.length;
  const dotsEl = document.getElementById('s-dots');
  dotsEl.innerHTML = Array.from({length: MAX_DNI}, (_, i) => {
    let cls = 'dot';
    if (i < sesionDNI.length) cls += ' filled';
    else if (i === sesionDNI.length && scanning) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function renderSessionList() {
  const cont = document.getElementById('session-list');
  cont.innerHTML = sesionDNI.map((d, i) => `
    <div class="session-item">
      <div class="si-num">${i + 1}</div>
      <div class="si-info">
        <div class="si-name">${d.apellido}, ${d.nombre}</div>
        <div class="si-dni">DNI ${d.dni} · ${d.sexo} · Nac. ${d.nacimiento} <span style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:10px;padding:1px 5px;margin-left:2px">${d.fuente}</span></div>
      </div>
      <button class="si-del" onclick="quitarDeSesion(${i})" title="Quitar">✕</button>
    </div>`).join('');
}

function quitarDeSesion(idx) {
  sesionDNI.splice(idx, 1);
  renderSessionBar();
  renderSessionList();
  if (!sesionDNI.length) document.getElementById('session-section').style.display = 'none';
  actualizarHint();
}

function guardarSesion() {
  if (!sesionDNI.length) { toast('No hay DNI en la sesión'); return; }
  const lista = cargarLista();
  sesionDNI.forEach(d => lista.unshift(d));
  localStorage.setItem('dni_registros', JSON.stringify(lista));
  toast(`${sesionDNI.length} DNI guardados`);
  limpiarSesion();
}

function copiarSesion() {
  if (!sesionDNI.length) { toast('No hay DNI en la sesión'); return; }
  const txt = sesionDNI.map((d, i) =>
    `[${i+1}] ${d.apellido}, ${d.nombre} | DNI: ${d.dni} | Sexo: ${d.sexo} | Nac: ${d.nacimiento} | Venc: ${d.vencimiento}`
  ).join('\n');
  navigator.clipboard.writeText(txt)
    .then(() => toast('Datos copiados al portapapeles'))
    .catch(() => toast('No se pudo copiar'));
}

function limpiarSesion() {
  pausarCamara();
  sesionDNI = [];
  sesionActiva = false;
  scanning = false;
  document.getElementById('session-bar').style.display = 'none';
  document.getElementById('session-section').style.display = 'none';
  document.getElementById('btn-start').style.display = 'block';
  document.getElementById('btn-stop').style.display = 'none';
  document.getElementById('btn-resume').style.display = 'none';
  if (html5QrCode) { html5QrCode.clear(); html5QrCode = null; }
  actualizarHint();
}

// ── MANUAL ────────────────────────────────────────────────
function guardarManual() {
  const apellido = document.getElementById('m-apellido').value.trim();
  const nombre   = document.getElementById('m-nombre').value.trim();
  const dni      = document.getElementById('m-dni').value.trim();
  if (!apellido || !nombre || !dni) { toast('Completá apellido, nombre y DNI'); return; }

  const datos = {
    apellido, nombre,
    sexo:        document.getElementById('m-sexo').value.trim().toUpperCase(),
    dni,
    ejemplar:    document.getElementById('m-ejemplar').value.trim(),
    nacimiento:  document.getElementById('m-nac').value.trim(),
    vencimiento: document.getElementById('m-venc').value.trim(),
    fuente: 'Manual',
    ts: new Date().toISOString()
  };

  // Agregar a sesión si hay una activa, sino guardar directo
  if (sesionActiva && sesionDNI.length < MAX_DNI) {
    const yaExiste = sesionDNI.some(d => d.dni === datos.dni);
    if (yaExiste) { toast('Ese DNI ya está en la sesión'); return; }
    sesionDNI.push(datos);
    renderSessionBar();
    renderSessionList();
    document.getElementById('session-section').style.display = 'block';
    switchTab('scan');
    toast('Agregado a la sesión actual');
  } else {
    const lista = cargarLista();
    lista.unshift(datos);
    localStorage.setItem('dni_registros', JSON.stringify(lista));
    toast('Guardado correctamente');
  }

  ['m-apellido','m-nombre','m-sexo','m-dni','m-ejemplar','m-nac','m-venc']
    .forEach(id => document.getElementById(id).value = '');
}

// ── STORAGE ───────────────────────────────────────────────
function cargarLista() {
  try { return JSON.parse(localStorage.getItem('dni_registros') || '[]'); }
  catch { return []; }
}

function borrarRegistro(idx) {
  const lista = cargarLista();
  lista.splice(idx, 1);
  localStorage.setItem('dni_registros', JSON.stringify(lista));
  renderSaved();
  toast('Registro eliminado');
}

function borrarTodos() {
  if (!confirm('¿Borrar todos los registros guardados?')) return;
  localStorage.removeItem('dni_registros');
  renderSaved();
  toast('Registros eliminados');
}

function copiarDatos(datos) {
  const txt = [
    `APELLIDO: ${datos.apellido}`,
    `NOMBRE: ${datos.nombre}`,
    `DNI: ${datos.dni}`,
    datos.sexo        ? `SEXO: ${datos.sexo}` : '',
    datos.nacimiento  ? `NACIMIENTO: ${datos.nacimiento}` : '',
    datos.vencimiento ? `VENCIMIENTO: ${datos.vencimiento}` : '',
    datos.ejemplar    ? `EJEMPLAR: ${datos.ejemplar}` : '',
  ].filter(Boolean).join('\n');
  navigator.clipboard.writeText(txt)
    .then(() => toast('Datos copiados'))
    .catch(() => toast('No se pudo copiar'));
}

// ── RENDER SAVED ──────────────────────────────────────────
function renderSaved() {
  const lista = cargarLista();
  const cont = document.getElementById('saved-list');
  if (!lista.length) {
    cont.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>No hay registros guardados</div>`;
    return;
  }
  cont.innerHTML = lista.map((d, i) => `
    <div class="saved-item">
      <div class="s-name">${d.apellido}, ${d.nombre}</div>
      <div class="s-meta">
        <span>DNI ${d.dni}</span>
        ${d.sexo ? `<span>${d.sexo}</span>` : ''}
        <span>${d.fuente}</span>
        <span>${new Date(d.ts).toLocaleDateString('es-AR')}</span>
      </div>
      <div class="s-actions">
        <button class="mini-btn" onclick='copiarDatos(${JSON.stringify(d)})'>Copiar</button>
        <button class="mini-btn del" onclick="borrarRegistro(${i})">Eliminar</button>
      </div>
    </div>`).join('');
}

function exportarTodos() {
  const lista = cargarLista();
  if (!lista.length) { toast('No hay datos para exportar'); return; }
  const txt = lista.map((d, i) => [
    `[${i+1}] ${d.apellido}, ${d.nombre}`,
    `DNI: ${d.dni} | Sexo: ${d.sexo} | Nac: ${d.nacimiento} | Venc: ${d.vencimiento}`,
    `Ejemplar: ${d.ejemplar} | Fuente: ${d.fuente}`,
    `Registro: ${new Date(d.ts).toLocaleString('es-AR')}`,
    ''
  ].join('\n')).join('\n');
  const blob = new Blob([txt], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `registros_dni_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ── TABS ──────────────────────────────────────────────────
function switchTab(tab) {
  ['scan','manual','saved'].forEach(t => {
    document.getElementById(`panel-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'saved') renderSaved();
}

// ── TOAST ─────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
