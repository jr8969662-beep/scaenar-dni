<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capturas DNI → Formulario</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#30363d;
    --accent:#2563eb; --accent-light:#3b82f6; --success:#16a34a;
    --text:#e6edf3; --text-muted:#7d8590; --danger:#dc2626; --warn:#d97706;
    --font:'Segoe UI', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  header .badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:20px;text-transform:uppercase}
  header h1{font-size:15px;font-weight:600;flex:1}

  main{flex:1;padding:20px 16px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}

  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .tab-btn{background:none;border:none;color:var(--text-muted);font-size:12px;font-family:var(--font);font-weight:500;padding:12px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s,color .15s}
  .tab-btn .icon{font-size:16px}
  .tab-btn.active{background:var(--accent);color:#fff}
  .tab-btn:not(.active):hover{background:var(--surface2);color:var(--text)}

  .panel{display:none;flex-direction:column;gap:14px}
  .panel.active{display:flex}

  .btn{width:100%;padding:14px;border-radius:10px;border:none;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-warn{background:var(--warn);color:#fff}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-sm{font-size:12px;padding:10px}

  .action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-size:12px;font-weight:600;color:var(--text-muted)}
  .form-group input, .form-group select{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;padding:10px 12px;width:100%;outline:none}
  .form-group input:focus, .form-group select:focus{border-color:var(--accent-light)}

  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);margin-top:6px}

  .persona{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--success);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;animation:slideIn .25s ease}
  .persona.incompleta{border-left-color:var(--warn)}
  .persona.enviada{border-left-color:var(--accent);opacity:.7}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .persona .p-head{display:flex;align-items:center;gap:4px;justify-content:space-between}
  .persona .p-name{font-size:14px;font-weight:600;word-break:break-word;line-height:1.3}
  .persona .p-dni{font-size:11px;color:var(--text-muted);margin-top:2px}
  .persona .p-badge-ok{color:var(--success);font-weight:700;font-size:12px}
  .persona .p-badge-falta{color:var(--warn);font-weight:700;font-size:11px}
  .persona .p-badge-enviado{color:var(--accent);font-weight:700;font-size:11px}
  .persona .p-del{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 6px;flex-shrink:0}
  .persona .p-field{display:flex;flex-direction:column;gap:3px}
  .persona .p-field label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
  .persona .p-field input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 9px;width:100%;outline:none}
  .persona .p-field select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 9px;width:100%;outline:none}
  .persona .p-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .upload-zone{background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--surface2)}
  .upload-zone .uz-icon{font-size:38px;margin-bottom:6px}
  .upload-zone .uz-title{font-size:14px;font-weight:600;margin-bottom:4px}
  .upload-zone .uz-sub{font-size:12px;color:var(--text-muted)}

  .progreso{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:none;flex-direction:column;gap:8px}
  .progreso.show{display:flex}
  .progreso .pr-txt{font-size:12px;display:flex;justify-content:space-between;gap:10px}
  .progreso .pr-txt strong{color:var(--accent-light)}
  .progreso .pr-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
  .progreso .pr-fill{height:100%;background:var(--accent);width:0%;transition:width .2s}

  .empty-state{text-align:center;color:var(--text-muted);font-size:14px;padding:30px 0}
  .empty-state .empty-icon{font-size:36px;margin-bottom:10px}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;z-index:100;transition:transform .25s ease;pointer-events:none;max-width:calc(100% - 24px);text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .contador{font-size:12px;color:var(--text-muted);text-align:center}
  .contador strong{color:var(--text)}

  .ocr-texto-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
  .ocr-texto-overlay.show{display:flex}
  .ocr-texto-modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;max-width:520px;width:100%;max-height:85vh;display:flex;flex-direction:column;gap:12px}
  .ocr-texto-modal h3{font-size:15px;font-weight:600}
  .ocr-texto-modal pre{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text);overflow:auto;flex:1;max-height:60vh}

  .envio-persona{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--text-muted);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px}
  .envio-persona.enviado{border-left-color:var(--success)}
  .envio-persona.error{border-left-color:var(--danger)}
  .envio-persona.enviando{border-left-color:var(--accent)}
  .envio-persona .ep-nombre{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .envio-persona .ep-estado{font-size:11px;color:var(--text-muted)}
</style>
</head>
<body>

<header>
  <span class="badge">DNI AR</span>
  <h1>Capturas → Formulario</h1>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('capturas')" id="tab-capturas"><span class="icon">📷</span>Capturas</button>
    <button class="tab-btn" onclick="switchTab('mensaje')" id="tab-mensaje"><span class="icon">📝</span>Mensaje</button>
    <button class="tab-btn" onclick="switchTab('enviar')" id="tab-enviar"><span class="icon">📤</span>Enviar</button>
  </div>

  <!-- CAPTURAS -->
  <div class="panel active" id="panel-capturas">
    <div class="upload-zone" id="upload-zone" onclick="abrirSelector()">
      <div class="uz-icon">📷</div>
      <div class="uz-title">Agregar capturas del sistema</div>
      <div class="uz-sub">Tocá para elegir una o varias imágenes</div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple style="display:none">

    <div class="progreso" id="progreso">
      <div class="pr-txt"><span id="pr-estado">Procesando...</span><strong id="pr-num"></strong></div>
      <div class="pr-bar"><div class="pr-fill" id="pr-fill"></div></div>
    </div>

    <div class="contador" id="contador"></div>
    <div id="lista-personas"></div>

    <div class="action-row" id="acciones-capturas" style="display:none">
      <button class="btn btn-outline" onclick="irAMensaje()">Ir a Mensaje</button>
      <button class="btn btn-danger" onclick="borrarTodas()">Borrar todas</button>
    </div>
  </div>

  <!-- MENSAJE -->
  <div class="panel" id="panel-mensaje">
    <p class="section-title">Mensaje de texto (para WhatsApp)</p>
    <button class="btn btn-primary" onclick="copiarMensaje()">📋 Copiar mensaje</button>
    <button class="btn btn-outline" onclick="verPreview()">Previsualizar</button>
    <div id="msg-preview" style="display:none">
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text-muted);max-height:300px;overflow:auto" id="preview-box"></div>
    </div>
  </div>

  <!-- ENVIAR -->
  <div class="panel" id="panel-enviar">
    <p class="section-title">Datos del turno</p>
    <div class="form-group">
      <label>Punto Asignado</label>
      <select id="cfg-punto">
        <option>Monumento</option>
        <option>Parque San Martin</option>
        <option>Usina</option>
        <option>Plaza 9 de Julio</option>
        <option>Plaza Alvarado</option>
        <option>Plaza Belgrano</option>
        <option>Plazoleta 4 siglos</option>
        <option selected>Catedral</option>
        <option>Alberdi y San Martin</option>
        <option>Florida y San Martin</option>
        <option>Paseo de los Poeta</option>
        <option>Patrulla Grand Bourg</option>
        <option>Patrulla B° Profesional</option>
      </select>
    </div>
    <div class="form-group">
      <label>Jerarquía</label>
      <select id="cfg-jerarquia">
        <option>SOM</option>
        <option>SOP</option>
        <option>SGTO AYTE</option>
        <option>SGTO</option>
        <option>CBO</option>
        <option selected>AGTE</option>
      </select>
    </div>
    <div class="form-group">
      <label>Legajo</label>
      <input type="text" id="cfg-legajo" placeholder="1234" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>Observaciones (opcional)</label>
      <input type="text" id="cfg-observaciones" placeholder="Sin novedad">
    </div>

    <p class="section-title">Envío</p>
    <button class="btn btn-success" id="btn-enviar-todos" onclick="enviarTodos()">📤 Enviar todas al formulario</button>
    <button class="btn btn-outline" onclick="abrirTodosPrellenados()">🔗 Abrir prellenadas (1 por 1)</button>

    <p class="section-title" style="margin-top:6px">Estado <span id="envio-count" style="color:var(--accent-light)"></span></p>
    <div id="lista-envio"></div>

    <!-- Iframes ocultos para los POSTs -->
    <iframe name="google-form-target" id="google-form-target" style="display:none"></iframe>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="ocr-texto-overlay" id="ocr-texto-overlay" onclick="if(event.target===this)cerrarTextoOCR()">
  <div class="ocr-texto-modal">
    <h3 id="ocr-texto-titulo">Texto crudo del OCR</h3>
    <pre id="ocr-texto-contenido"></pre>
    <button class="btn btn-outline" onclick="cerrarTextoOCR()">Cerrar</button>
  </div>
</div>

<script>
/* ══════════════ CONFIG DEL FORM ══════════════ */
const FORM_ACTION    = 'https://docs.google.com/forms/d/e/1FAIpQLScZ4w3a1Ej0leUBo3yUxeMwUrwgHbnqSEh53YQxoncWfSx_Zw/formResponse';
const FORM_VIEW      = 'https://docs.google.com/forms/d/e/1FAIpQLScZ4w3a1Ej0leUBo3yUxeMwUrwgHbnqSEh53YQxoncWfSx_Zw/viewform';
const FORM_FBZX      = '3093474308865497144';
const TIPO_REGISTRO  = 'IDENTIFICACION DE PERSONAS';

const ENTRY = {
  tipo:        'entry.1417575766',
  punto:       'entry.69431228',
  jerarquia:   'entry.2122136359',
  legajo:      'entry.993241650',
  apellidoNom: 'entry.1946225731',
  dni:         'entry.918359967',
  domicilio:   'entry.210518898',
  sips:        'entry.2042254488',
  observ:      'entry.342572363'
};

/* ══════════════ ESTADO ══════════════ */
const STORAGE_KEY = 'personas_capturas_v3';
const CFG_KEY     = 'cfg_envio_v3';

const HEAD_MSG = `📢 *DIV. INTERVENCIÓN CIUDADANA 1 (DIC)*

*FECHA:* 
*HORA:*   

*JEFE DPTO. INTERVENCION CIUDADANA (DIC 1)* 
//

*JEFE DIV. INTERVENCION CIUDADANA 1 (DIC):*
Crío Jael Bonavota 

*OFICIAL DE SERVICIO:*
//

*JEFE DE TERCIO:*
Sgto Ayte. Fiscina Matías 

*PUNTO ASIGNADO:*
Móvil 2354 Cría 5ta 

*RECURSO DIC1:*
Chófer 
Sop Alemán Roberto (DIC1) 
Custodio 
Sgto Guaymas Emanuel (DIC-1)
Refuerzo 
Agte Ovando Eugenia (DIC-1)

*NOVEDADES* 
Informo que se realizó identificación de Persona con el siguiente resultado 
`;

const FOOT_MSG = `*INFORMANTE:* 
Sgto Guaymas Emanuel (DIC-1)`;

let personas = [];
let tesseractWorker = null;
let procesando = false;
let archivosOriginales = {};
let idxTextoOCR = -1;
let estadosEnvio = {}; // idx -> 'pendiente'|'enviando'|'enviado'|'error'

/* ══════════════ UTILIDADES ══════════════ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function normalizar(s) {
  return (s || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}
function personaCompleta(p) {
  return !!(p.domicilio && p.domicilio.trim() && p.codigo_dic && p.codigo_dic.trim());
}

function guardarPersonas() {
  try {
    const paraGuardar = personas.map(p => { const { _raw, ...resto } = p; return resto; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(paraGuardar));
  } catch (e) {}
}
function cargarPersonas() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
}

/* ══════════════ OCR + PARSER ══════════════ */
function abrirSelector() {
  if (procesando) { toast('Esperá, todavía estoy procesando'); return; }
  document.getElementById('file-input').click();
}

document.getElementById('file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  if (files.length) procesarArchivos(files);
  e.target.value = '';
});

async function procesarArchivos(files) {
  if (procesando) return;
  procesando = true;

  const prog = document.getElementById('progreso');
  const estado = document.getElementById('pr-estado');
  const num = document.getElementById('pr-num');
  const fill = document.getElementById('pr-fill');
  prog.classList.add('show');

  try {
    if (!tesseractWorker) {
      estado.textContent = 'Descargando idioma (solo la primera vez)...';
      fill.style.width = '5%';
      tesseractWorker = await Tesseract.createWorker('spa', 1, {
        logger: m => {
          if (m.status && m.progress != null) {
            fill.style.width = (5 + Math.round(m.progress * 20)) + '%';
          }
        }
      });
    }

    let ok = 0, dup = 0, err = 0;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      estado.textContent = `Leyendo imagen ${i + 1} de ${files.length}...`;
      num.textContent = `${i + 1}/${files.length}`;
      fill.style.width = Math.round(((i + 0.1) / files.length) * 100) + '%';

      try {
        const { data: { text } } = await tesseractWorker.recognize(file);
        const datos = parsearCaptura(text);

        if (!datos.apellido && !datos.nombre && !datos.dni) { err++; continue; }
        if (datos.dni && personas.some(p => p.dni === datos.dni)) { dup++; continue; }

        const idx = personas.length;
        personas.push({
          apellido:    datos.apellido || '',
          nombre:      datos.nombre || '',
          dni:         datos.dni || '',
          domicilio:   datos.domicilio || '',
          codigo_dic:  datos.codigo_dic || '',
          _raw:        datos._raw || '',
          fuente:      'Captura',
          ts:          new Date().toISOString()
        });
        archivosOriginales[idx] = file;
        estadosEnvio[idx] = 'pendiente';
        ok++;
        renderTodo();
      } catch (e) { err++; }

      fill.style.width = Math.round(((i + 1) / files.length) * 100) + '%';
    }

    estado.textContent = 'Listo';
    setTimeout(() => { prog.classList.remove('show'); fill.style.width = '0%'; }, 700);

    let msg = [];
    if (ok)  msg.push(`${ok} agregada${ok !== 1 ? 's' : ''}`);
    if (dup) msg.push(`${dup} repetida${dup !== 1 ? 's' : ''}`);
    if (err) msg.push(`${err} sin datos`);
    toast('✅ ' + (msg.join(' · ') || 'sin novedades'));
  } catch (e) {
    prog.classList.remove('show');
    toast('Error: no se pudo iniciar el lector');
  } finally {
    procesando = false;
  }
}

function parsearCaptura(texto) {
  const out = { apellido:'', nombre:'', dni:'', domicilio:'', codigo_dic:'', _raw: texto || '' };
  if (!texto) return out;

  const txt = texto.replace(/\r/g, '').replace(/[ \t\u00A0]+/g, ' ').trim();
  const lineas = txt.split('\n').map(l => l.trim()).filter(Boolean);

  const ETIQUETAS = ['APELLIDO','NOMBRE','NOMBRES','DOCUMENTO','DNI','DOMICILIO','CODIGO','CÓDIGO',
    'FECHA DE NAC','NACIMIENTO','EDAD','SEXO','NACIONALIDAD','LUGAR','PRONTUARIO',
    'GOBIERNO','MINISTERIO','POLICIA','POLICÍA','SIPS','SISTEMA','NUEVA BUSQUEDA','APP POLICIAL'];

  const esEtiquetaSola = linea => {
    const l = normalizar(linea).replace(/[:\s\.]+$/,'').trim();
    if (!l || l.length > 30) return false;
    return ETIQUETAS.some(e => { const n = normalizar(e); return l === n || l === n + ':' || l === n + '/S'; });
  };
  const contieneEtiqueta = linea => {
    const l = normalizar(linea);
    return ETIQUETAS.some(e => {
      const n = normalizar(e);
      try { return new RegExp('\\b' + n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b').test(l); }
      catch { return false; }
    });
  };

  function limpiarNombreOCR(s) {
    if (!s) return '';
    let v = s.trim();
    const m = v.match(/^([A-Za-zÁÉÍÓÚÑáéíóúñ]{1,6})[,\.]\s+(.+)$/);
    if (m && /^[A-ZÁÉÍÓÚÑ]/.test(m[2])) v = m[2];
    v = v.replace(/^([a-záéíóúñ]{1,4}[,\.]?\s+)+/, '');
    v = v.replace(/^[^\wÁÉÍÓÚÑáéíóúñ]+/, '');
    v = v.replace(/[\s,\.\-—;:]+$/, '');
    v = v.replace(/\s+/g, ' ').trim();
    return v;
  }

  function valorDeEtiqueta(etiquetas) {
    for (let i = 0; i < lineas.length; i++) {
      const lineaUp = normalizar(lineas[i]);
      for (const e of etiquetas) {
        const n = normalizar(e);
        let regex;
        try { regex = new RegExp('\\b' + n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b'); }
        catch { continue; }
        const m = lineaUp.match(regex);
        if (m) {
          const after = lineas[i].substring(m.index + m[0].length).replace(/^[\s:\-\/]+/,'').trim();
          if (after && after.length > 1 && !esEtiquetaSola(after)) return after;
          for (let j = i + 1; j < Math.min(lineas.length, i + 4); j++) {
            const lj = lineas[j].trim();
            if (esEtiquetaSola(lj)) break;
            if (lj.length > 1 && !contieneEtiqueta(lj)) return lj;
          }
        }
      }
    }
    return '';
  }

  // DNI
  let dni = valorDeEtiqueta(['Documento','DNI']);
  if (dni) { const d = dni.replace(/\./g,'').replace(/\D/g,''); if (/^\d{6,8}$/.test(d)) out.dni = d; }
  if (!out.dni) {
    for (const l of lineas) {
      const m = l.match(/(?<!\d)(\d{7,8})(?!\d)/);
      if (m && !/^(19|20)\d{6}$/.test(m[1])) { out.dni = m[1]; break; }
    }
  }

  // Apellido
  out.apellido = limpiarNombreOCR(valorDeEtiqueta(['Apellido','Apellidos']));
  if (!out.apellido || out.apellido.length < 2) {
    const idx = lineas.findIndex(l => /\bapellido\b/i.test(l));
    if (idx >= 0) for (let j = idx+1; j < Math.min(lineas.length, idx+4); j++) {
      const c = limpiarNombreOCR(lineas[j]);
      if (c.length >= 2 && !contieneEtiqueta(c) && /^[A-ZÁÉÍÓÚÑ]/.test(c)) { out.apellido = c; break; }
    }
  }

  // Nombre
  out.nombre = limpiarNombreOCR(valorDeEtiqueta(['Nombre','Nombres']));
  if (!out.nombre || out.nombre.length < 2) {
    const idx = lineas.findIndex(l => /\bnombres?\b/i.test(l));
    if (idx >= 0) for (let j = idx+1; j < Math.min(lineas.length, idx+4); j++) {
      const c = limpiarNombreOCR(lineas[j]);
      if (c.length >= 2 && !contieneEtiqueta(c) && /^[A-ZÁÉÍÓÚÑ]/.test(c)) { out.nombre = c; break; }
    }
  }

  if (out.apellido) out.apellido = out.apellido.replace(/\s+(DOCUMENTO|DNI|NOMBRE|DOMICILIO|SEXO|FECHA).*$/i,'').trim();
  if (out.nombre)   out.nombre   = out.nombre.replace(/\s+(DOCUMENTO|DNI|APELLIDO|DOMICILIO|SEXO|FECHA).*$/i,'').trim();

  // Domicilio
  for (let i = 0; i < lineas.length; i++) {
    const mDom = lineas[i].match(/\bdomicilio\b/i);
    if (mDom) {
      const partes = [];
      const after = lineas[i].substring(mDom.index + mDom[0].length).replace(/^[\s:\-\/]+/,'').trim();
      if (after && after.length > 2 && !esEtiquetaSola(after)) partes.push(after);
      for (let j = i+1; j < lineas.length; j++) {
        const lj = lineas[j].trim();
        if (/c[oó]digo/i.test(lj)) break;
        if (out.dni && lj.replace(/\D/g,'') === out.dni) break;
        if (/^\d{7,}$/.test(lj.replace(/\s/g,''))) break;
        if (!/[a-zA-Z0-9ÁÉÍÓÚÑáéíóúñ]/.test(lj)) break;
        if (esEtiquetaSola(lj)) break;
        partes.push(lj);
        if (partes.join(' ').length > 150) break;
      }
      if (partes.length) {
        out.domicilio = partes.join(' ').replace(/\s+/g,' ').replace(/\bN\s*[*°º°]\s*/gi,'N° ').replace(/[\s,\.\-—]+$/,'').trim();
      }
      break;
    }
  }

  // Código
  const mCod = texto.match(/C[OÓ]DIGO\s*[:\-]?\s*(AZUL|NEGRO|BLANCO|ROJO)/i);
  if (mCod) out.codigo_dic = mCod[1].toUpperCase();

  return out;
}

/* ══════════════ RENDER ══════════════ */
function renderTodo() {
  renderLista();
  renderContador();
  renderEnvio();
  guardarPersonas();
}

function renderContador() {
  const el = document.getElementById('contador');
  const total = personas.length;
  const completas = personas.filter(personaCompleta).length;
  const acc = document.getElementById('acciones-capturas');
  if (!total) { el.textContent = ''; acc.style.display = 'none'; return; }
  const faltan = total - completas;
  el.innerHTML = `<strong>${total}</strong> persona${total !== 1 ? 's' : ''} · ${completas} completa${completas !== 1 ? 's' : ''}${faltan ? ` · <span style="color:var(--warn)">${faltan} sin completar</span>` : ''}`;
  acc.style.display = 'grid';
}

function renderLista() {
  const cont = document.getElementById('lista-personas');
  if (!personas.length) {
    cont.innerHTML = `<div class="empty-state"><div class="empty-icon">📷</div>Cargá una captura del sistema<br>para empezar</div>`;
    return;
  }
  cont.innerHTML = personas.map((p, i) => {
    const completa = personaCompleta(p);
    const cod = p.codigo_dic || '';
    const nombre = `${p.apellido}${p.nombre ? ', ' + p.nombre : ''}`.trim() || '(sin nombre)';
    return `
    <div class="persona ${completa?'':'incompleta'}" id="per-${i}">
      <div class="p-head">
        <div style="flex:1;min-width:0">
          <div class="p-name">${esc(nombre)}</div>
          <div class="p-dni">
            ${p.dni ? 'DNI ' + esc(p.dni) : ''}
            ${completa ? ' <span class="p-badge-ok">✅</span>' : ' <span class="p-badge-falta">⚠️ falta completar</span>'}
          </div>
        </div>
        <button class="p-del" onclick="verTextoOCR(${i})" title="Ver texto OCR" style="font-size:14px">🔍</button>
        <button class="p-del" onclick="borrarPersona(${i})" title="Quitar">✕</button>
      </div>
      <div class="p-row">
        <div class="p-field"><label>Apellido</label><input type="text" value="${esc(p.apellido)}" oninput="editar(${i},'apellido',this.value)"></div>
        <div class="p-field"><label>Nombre</label><input type="text" value="${esc(p.nombre)}" oninput="editar(${i},'nombre',this.value)"></div>
      </div>
      <div class="p-row">
        <div class="p-field"><label>DNI</label><input type="text" value="${esc(p.dni)}" oninput="editar(${i},'dni',this.value)" inputmode="numeric"></div>
        <div class="p-field"><label>Código</label>
          <select onchange="editar(${i},'codigo_dic',this.value)">
            <option value="" ${!cod?'selected':''}>— sin código —</option>
            <option value="AZUL"   ${cod==='AZUL'?'selected':''}>AZUL</option>
            <option value="NEGRO"  ${cod==='NEGRO'?'selected':''}>NEGRO</option>
            <option value="BLANCO" ${cod==='BLANCO'?'selected':''}>BLANCO</option>
            <option value="ROJO"   ${cod==='ROJO'?'selected':''}>ROJO</option>
          </select>
        </div>
      </div>
      <div class="p-field"><label>Domicilio</label>
        <input type="text" value="${esc(p.domicilio)}" placeholder="Calle N°, Barrio, Localidad" oninput="editar(${i},'domicilio',this.value)">
      </div>
    </div>`;
  }).join('');
}

function editar(idx, campo, valor) {
  if (!personas[idx]) return;
  personas[idx][campo] = valor;
  guardarPersonas();
  const item = document.getElementById(`per-${idx}`);
  if (item) {
    const p = personas[idx];
    const completa = personaCompleta(p);
    item.classList.toggle('incompleta', !completa);
    const nameEl = item.querySelector('.p-name');
    if (nameEl && (campo === 'apellido' || campo === 'nombre')) {
      nameEl.textContent = `${p.apellido}${p.nombre ? ', ' + p.nombre : ''}`.trim() || '(sin nombre)';
    }
    const dniEl = item.querySelector('.p-dni');
    if (dniEl) {
      dniEl.innerHTML = `${p.dni ? 'DNI ' + esc(p.dni) : ''}${completa ? ' <span class="p-badge-ok">✅</span>' : ' <span class="p-badge-falta">⚠️ falta completar</span>'}`;
    }
  }
  renderContador();
  renderEnvio();
}

function borrarPersona(idx) {
  personas.splice(idx, 1);
  delete archivosOriginales[idx];
  delete estadosEnvio[idx];
  renderTodo();
  toast('Persona eliminada');
}

function borrarTodas() {
  if (!personas.length) return;
  if (!confirm('¿Borrar todas las personas cargadas?')) return;
  personas = [];
  archivosOriginales = {};
  estadosEnvio = {};
  renderTodo();
  toast('Listado vacío');
}

/* ══════════════ VER TEXTO OCR ══════════════ */
function verTextoOCR(idx) {
  const p = personas[idx];
  if (!p) return;
  idxTextoOCR = idx;
  document.getElementById('ocr-texto-titulo').textContent = `Texto crudo OCR — ${p.apellido || '?'} ${p.nombre || ''}`.trim();
  document.getElementById('ocr-texto-contenido').textContent = p._raw || '(sin texto guardado)';
  document.getElementById('ocr-texto-overlay').classList.add('show');
}
function cerrarTextoOCR() {
  document.getElementById('ocr-texto-overlay').classList.remove('show');
  idxTextoOCR = -1;
}

/* ══════════════ MENSAJE ══════════════ */
function armarMensaje() {
  const lista = personas.map(p => {
    const nombre = `${p.apellido || ''} ${p.nombre || ''}`.trim() || '(sin nombre)';
    const dom = (p.domicilio || '').trim() || 'no existe registros';
    const cod = (p.codigo_dic || '').trim() || '—';
    return [nombre, `DNI ${p.dni || '—'}`, `Dlio ${dom}`, `Código ${cod}`].join('\n');
  }).join('\n\n');

  const partes = [HEAD_MSG.trim()];
  if (lista) partes.push(lista);
  if (FOOT_MSG.trim()) partes.push(FOOT_MSG.trim());
  return partes.filter(Boolean).join('\n\n');
}

function copiarMensaje() {
  if (!personas.length) { toast('No hay personas cargadas'); return; }
  const txt = armarMensaje();
  navigator.clipboard.writeText(txt)
    .then(() => toast('Mensaje copiado'))
    .catch(() => toast('No se pudo copiar'));
}

function verPreview() {
  const box = document.getElementById('msg-preview');
  document.getElementById('preview-box').textContent = armarMensaje() || '(vacío)';
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function irAMensaje() { switchTab('mensaje'); }

/* ══════════════ ENVÍO AL FORM ══════════════ */
function mapearSIPS(cod) {
  if (!cod) return 'Inexistente';
  const c = cod.toUpperCase();
  if (c.includes('BLANCO')) return 'Cod. Blanco';
  if (c.includes('AZUL'))   return 'Cod. Azul';
  if (c.includes('NEGRO'))  return 'Cod. Negro';
  if (c.includes('ROJO'))   return 'Cod. Rojo';
  return 'Inexistente';
}

function guardarConfigEnvio() {
  const cfg = {
    punto:         document.getElementById('cfg-punto').value,
    jerarquia:     document.getElementById('cfg-jerarquia').value,
    legajo:        document.getElementById('cfg-legajo').value,
    observaciones: document.getElementById('cfg-observaciones').value
  };
  try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {}
}
function cargarConfigEnvio() {
  try {
    const cfg = JSON.parse(localStorage.getItem(CFG_KEY) || '{}');
    if (cfg.punto)         document.getElementById('cfg-punto').value = cfg.punto;
    if (cfg.jerarquia)     document.getElementById('cfg-jerarquia').value = cfg.jerarquia;
    if (cfg.legajo)        document.getElementById('cfg-legajo').value = cfg.legajo;
    if (cfg.observaciones) document.getElementById('cfg-observaciones').value = cfg.observaciones;
  } catch (e) {}
}

function renderEnvio() {
  const cont = document.getElementById('lista-envio');
  const cnt = document.getElementById('envio-count');
  cnt.textContent = personas.length ? `(${personas.length})` : '(vacío)';

  if (!personas.length) {
    cont.innerHTML = `<div class="empty-state"><div class="empty-icon">📤</div>Primero cargá capturas</div>`;
    return;
  }

  cont.innerHTML = personas.map((p, i) => {
    const est = estadosEnvio[i] || 'pendiente';
    const nombre = `${p.apellido} ${p.nombre}`.trim() || '(sin nombre)';
    let estTxt = '⏳ pendiente';
    if (est === 'enviando') estTxt = '⏳ enviando...';
    if (est === 'enviado')  estTxt = '✅ enviado';
    if (est === 'error')    estTxt = '❌ error';
    return `<div class="envio-persona ${est}">
      <span class="ep-nombre">${esc(nombre)}</span>
      <span class="ep-estado">${estTxt}</span>
    </div>`;
  }).join('');
}

function construirCampos(p) {
  const cfg = {
    punto:         document.getElementById('cfg-punto').value,
    jerarquia:     document.getElementById('cfg-jerarquia').value,
    legajo:        document.getElementById('cfg-legajo').value,
    observaciones: document.getElementById('cfg-observaciones').value
  };
  return {
    [ENTRY.punto]:       cfg.punto,
    [ENTRY.jerarquia]:   cfg.jerarquia,
    [ENTRY.legajo]:      cfg.legajo,
    [ENTRY.apellidoNom]: `${p.apellido} ${p.nombre}`.trim(),
    [ENTRY.dni]:         p.dni || '',
    [ENTRY.domicilio]:   p.domicilio || 'S/C',
    [ENTRY.sips]:        mapearSIPS(p.codigo_dic),
    [ENTRY.observ]:      cfg.observaciones || ''
  };
}

function postForm(campos) {
  return new Promise(resolve => {
    const form = document.createElement('form');
    form.method = 'POST';
    form.action = FORM_ACTION;
    form.target = 'google-form-target';
    form.style.display = 'none';

    // Primero el tipo (es la primera página)
    const tipoInp = document.createElement('input');
    tipoInp.type = 'hidden';
    tipoInp.name = ENTRY.tipo;
    tipoInp.value = TIPO_REGISTRO;
    form.appendChild(tipoInp);

    for (const k in campos) {
      const inp = document.createElement('input');
      inp.type = 'hidden';
      inp.name = k;
      inp.value = campos[k];
      form.appendChild(inp);
    }

    // Metadatos
    [
      ['fvv','1'],
      ['pageHistory','0'],
      ['fbzx', FORM_FBZX],
      ['submissionTimestamp','-1']
    ].forEach(([n,v]) => {
      const inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = n; inp.value = v;
      form.appendChild(inp);
    });

    document.body.appendChild(form);
    form.submit();
    setTimeout(() => { form.remove(); resolve(true); }, 1500);
  });
}

async function enviarTodos() {
  if (!personas.length) { toast('No hay personas'); return; }
  if (!document.getElementById('cfg-legajo').value.trim()) {
    toast('Completá el Legajo antes de enviar'); return;
  }

  const btn = document.getElementById('btn-enviar-todos');
  btn.disabled = true;

  for (let i = 0; i < personas.length; i++) {
    estadosEnvio[i] = 'enviando';
    renderEnvio();
    try {
      await postForm(construirCampos(personas[i]));
      estadosEnvio[i] = 'enviado';
    } catch (e) {
      estadosEnvio[i] = 'error';
    }
    renderEnvio();
    // Pausa entre envíos para no saturar
    await new Promise(r => setTimeout(r, 1800));
  }

  btn.disabled = false;
  const ok = Object.values(estadosEnvio).filter(e => e === 'enviado').length;
  toast(`✅ ${ok} de ${personas.length} enviadas`);
}

/* Abre el form prellenado (opción manual, más confiable) */
function abrirPrellenado(idx) {
  const p = personas[idx];
  if (!p) return;
  const cfg = {
    punto:         document.getElementById('cfg-punto').value,
    jerarquia:     document.getElementById('cfg-jerarquia').value,
    legajo:        document.getElementById('cfg-legajo').value,
    observaciones: document.getElementById('cfg-observaciones').value
  };
  const params = new URLSearchParams();
  params.set(ENTRY.tipo, TIPO_REGISTRO);
  params.set(ENTRY.punto, cfg.punto);
  params.set(ENTRY.jerarquia, cfg.jerarquia);
  params.set(ENTRY.legajo, cfg.legajo);
  params.set(ENTRY.apellidoNom, `${p.apellido} ${p.nombre}`.trim());
  params.set(ENTRY.dni, p.dni || '');
  params.set(ENTRY.domicilio, p.domicilio || 'S/C');
  params.set(ENTRY.sips, mapearSIPS(p.codigo_dic));
  params.set(ENTRY.observ, cfg.observaciones || '');
  params.set('usp', 'pp_url');

  const url = FORM_VIEW + '?' + params.toString();
  window.open(url, '_blank');
}

function abrirTodosPrellenados() {
  if (!personas.length) { toast('No hay personas'); return; }
  toast('Se van a abrir ' + personas.length + ' pestañas. Permití las ventanas emergentes.');
  personas.forEach((p, i) => {
    setTimeout(() => abrirPrellenado(i), i * 800);
  });
}

/* ══════════════ TABS ══════════════ */
function switchTab(tab) {
  ['capturas', 'mensaje', 'enviar'].forEach(t => {
    document.getElementById(`panel-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'enviar') renderEnvio();
}

/* ══════════════ TOAST ══════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

/* ══════════════ INIT ══════════════ */
(function init() {
  personas = cargarPersonas();
  personas.forEach((p, i) => { estadosEnvio[i] = 'pendiente'; });

  // Drag & drop
  const zone = document.getElementById('upload-zone');
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.remove('dragover');
  }));
  zone.addEventListener('drop', e => {
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
    if (files.length) procesarArchivos(files);
  });

  // Config persistente
  cargarConfigEnvio();
  ['cfg-punto','cfg-jerarquia','cfg-legajo','cfg-observaciones'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', guardarConfigEnvio);
    if (el) el.addEventListener('blur', guardarConfigEnvio);
  });

  renderTodo();
})();
</script>
