<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capturas DNI → Mensaje</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#30363d;
    --accent:#2563eb; --accent-light:#3b82f6; --success:#16a34a;
    --text:#e6edf3; --text-muted:#7d8590; --danger:#dc2626; --warn:#d97706;
    --font:'Segoe UI', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  header .badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:20px;text-transform:uppercase}
  header h1{font-size:16px;font-weight:600;flex:1}

  main{flex:1;padding:20px 16px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}

  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .tab-btn{background:none;border:none;color:var(--text-muted);font-size:13px;font-family:var(--font);font-weight:500;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s,color .15s}
  .tab-btn .icon{font-size:18px}
  .tab-btn.active{background:var(--accent);color:#fff}
  .tab-btn:not(.active):hover{background:var(--surface2);color:var(--text)}

  .panel{display:none;flex-direction:column;gap:14px}
  .panel.active{display:flex}

  .btn{width:100%;padding:14px;border-radius:10px;border:none;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-light)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-warn{background:var(--warn);color:#fff}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{background:var(--surface2)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-size:12px;font-weight:600;color:var(--text-muted)}
  .form-group textarea{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;padding:10px 12px;width:100%;outline:none;resize:vertical;min-height:60px;transition:border-color .15s}
  .form-group textarea:focus{border-color:var(--accent-light)}

  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted)}

  /* Lista de personas */
  .persona{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--success);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;animation:slideIn .25s ease}
  .persona.incompleta{border-left-color:var(--warn)}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .persona .p-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .persona .p-name{font-size:14px;font-weight:600;word-break:break-word;line-height:1.3}
  .persona .p-dni{font-size:11px;color:var(--text-muted);margin-top:2px}
  .persona .p-badge-ok{color:var(--success);font-weight:700;font-size:12px}
  .persona .p-badge-falta{color:var(--warn);font-weight:700;font-size:11px}
  .persona .p-del{background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 6px;flex-shrink:0}
  .persona .p-del:hover{color:var(--danger)}
  .persona .p-field{display:flex;flex-direction:column;gap:3px}
  .persona .p-field label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted)}
  .persona .p-field input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 9px;width:100%;outline:none}
  .persona .p-field input:focus{border-color:var(--accent-light)}
  .persona .p-field select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;padding:7px 9px;width:100%;outline:none}
  .persona .p-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  /* Upload zone */
  .upload-zone{background:var(--surface);border:2px dashed var(--border);border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
  .upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--surface2)}
  .upload-zone .uz-icon{font-size:38px;margin-bottom:6px}
  .upload-zone .uz-title{font-size:14px;font-weight:600;margin-bottom:4px}
  .upload-zone .uz-sub{font-size:12px;color:var(--text-muted)}

  /* Progreso */
  .progreso{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:none;flex-direction:column;gap:8px}
  .progreso.show{display:flex}
  .progreso .pr-txt{font-size:12px;display:flex;justify-content:space-between;gap:10px}
  .progreso .pr-txt strong{color:var(--accent-light)}
  .progreso .pr-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
  .progreso .pr-fill{height:100%;background:var(--accent);width:0%;transition:width .2s}

  /* Preview */
  .preview-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text-muted);max-height:300px;overflow:auto}

  .empty-state{text-align:center;color:var(--text-muted);font-size:14px;padding:30px 0}
  .empty-state .empty-icon{font-size:36px;margin-bottom:10px}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;z-index:100;transition:transform .25s ease;pointer-events:none;max-width:calc(100% - 24px);text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .contador{font-size:12px;color:var(--text-muted);text-align:center}
  .contador strong{color:var(--text)}
</style>
</head>
<body>

<header>
  <span class="badge">DNI AR</span>
  <h1>Capturas → Mensaje</h1>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('capturas')" id="tab-capturas"><span class="icon">📷</span>Capturas</button>
    <button class="tab-btn" onclick="switchTab('mensaje')" id="tab-mensaje"><span class="icon">📝</span>Mensaje</button>
  </div>

  <!-- ═══ CAPTURAS ═══ -->
  <div class="panel active" id="panel-capturas">
    <div class="upload-zone" id="upload-zone" onclick="abrirSelector()">
      <div class="uz-icon">📷</div>
      <div class="uz-title">Agregar capturas del sistema</div>
      <div class="uz-sub">Tocá para elegir una o varias imágenes</div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple style="display:none">

    <div class="progreso" id="progreso">
      <div class="pr-txt">
        <span id="pr-estado">Procesando...</span>
        <strong id="pr-num"></strong>
      </div>
      <div class="pr-bar"><div class="pr-fill" id="pr-fill"></div></div>
    </div>

    <div class="contador" id="contador"></div>

    <div id="lista-personas"></div>

    <div class="action-row" id="acciones-capturas" style="display:none">
      <button class="btn btn-outline" onclick="irAMensaje()">Ir a Mensaje</button>
      <button class="btn btn-danger" onclick="borrarTodas()">Borrar todas</button>
    </div>
  </div>

  <!-- ═══ MENSAJE ═══ -->
  <div class="panel" id="panel-mensaje">
    <p class="section-title">Encabezado</p>
    <div class="form-group">
      <textarea id="msg-head" rows="14"></textarea>
    </div>

    <p class="section-title">Personas <span id="msg-count" style="color:var(--accent-light)"></span></p>
    <div id="msg-personas"></div>

    <p class="section-title">Pie / Informante</p>
    <div class="form-group">
      <textarea id="msg-foot" rows="3"></textarea>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" onclick="copiarMensaje()">Copiar mensaje</button>
      <button class="btn btn-outline" onclick="verPreview()">Previsualizar</button>
    </div>

    <div id="msg-preview" style="display:none">
      <p class="section-title" style="margin-bottom:6px">Vista previa</p>
      <div class="preview-box" id="preview-box"></div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ══════════════ ESTADO ══════════════ */
const STORAGE_KEY = 'personas_capturas';
const HEAD_KEY    = 'msg_head_v2';
const FOOT_KEY    = 'msg_foot_v2';

const DEFAULT_HEAD = `📢 *DIV. INTERVENCIÓN CIUDADANA 1 (DIC)*

*FECHA:* 
*HORA:*   

*JEFE DPTO. INTERVENCION CIUDADANA (DIC 1)* 
//

*JEFE DIV. INTERVENCION CIUDADANA 1 (DIC):*
Crío Jael Bonavota 

*OFICIAL DE SERVICIO:*
//

*JEFE DE TERCIO:*
Sgto Ayte. Fiscina Matías 

*PUNTO ASIGNADO:*
Móvil 2354 Cría 5ta 

*RECURSO DIC1:*
Chófer 
Sop Alemán Roberto (DIC1) 
Custodio 
Sgto Guaymas Emanuel (DIC-1)
Refuerzo 
Agte Ovando Eugenia (DIC-1)

*NOVEDADES* 
Informo que se realizó identificación de Persona con el siguiente resultado 
`;

const DEFAULT_FOOT = `*INFORMANTE:* 
Sgto Guaymas Emanuel (DIC-1)`;

let personas = [];
let tesseractWorker = null;
let procesando = false;

/* ══════════════ UTILIDADES ══════════════ */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function normalizar(s) {
  return (s || '').toString()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase();
}

function personaCompleta(p) {
  return !!(p.domicilio && p.domicilio.trim() && p.codigo_dic && p.codigo_dic.trim());
}

/* ══════════════ PERSISTENCIA ══════════════ */
function guardarPersonas() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(personas)); } catch (e) {}
}
function cargarPersonas() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

/* ══════════════ OCR + PARSER ══════════════ */
function abrirSelector() {
  if (procesando) { toast('Esperá, todavía estoy procesando'); return; }
  document.getElementById('file-input').click();
}

document.getElementById('file-input').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  if (files.length) procesarArchivos(files);
  e.target.value = '';
});

async function procesarArchivos(files) {
  if (procesando) return;
  procesando = true;

  const prog = document.getElementById('progreso');
  const estado = document.getElementById('pr-estado');
  const num = document.getElementById('pr-num');
  const fill = document.getElementById('pr-fill');

  prog.classList.add('show');

  try {
    if (!tesseractWorker) {
      estado.textContent = 'Descargando idioma (solo la primera vez)...';
      num.textContent = '';
      fill.style.width = '5%';
      tesseractWorker = await Tesseract.createWorker('spa', 1, {
        logger: m => {
          if (m.status && m.progress != null) {
            const pct = 5 + Math.round(m.progress * 20);
            fill.style.width = pct + '%';
          }
        }
      });
    }

    let okCount = 0, dupCount = 0, errCount = 0;

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      estado.textContent = `Leyendo imagen ${i + 1} de ${files.length}...`;
      num.textContent = `${i + 1}/${files.length}`;
      fill.style.width = Math.round(((i + 0.1) / files.length) * 100) + '%';

      try {
        const { data: { text } } = await tesseractWorker.recognize(file);
        const datos = parsearCaptura(text);

        if (!datos.apellido && !datos.nombre && !datos.dni) {
          errCount++;
          continue;
        }

        // Duplicado por DNI
        if (datos.dni && personas.some(p => p.dni === datos.dni)) {
          dupCount++;
          continue;
        }

        personas.push({
          apellido:    datos.apellido || '',
          nombre:      datos.nombre || '',
          dni:         datos.dni || '',
          domicilio:   datos.domicilio || '',
          codigo_dic:  datos.codigo_dic || '',
          sexo:        datos.sexo || '',
          nacimiento:  datos.nacimiento || '',
          fuente:      'Captura',
          ts:          new Date().toISOString()
        });
        okCount++;
        renderTodo();
      } catch (err) {
        errCount++;
      }

      fill.style.width = Math.round(((i + 1) / files.length) * 100) + '%';
    }

    estado.textContent = 'Listo';
    setTimeout(() => { prog.classList.remove('show'); fill.style.width = '0%'; }, 700);

    let msg = [];
    if (okCount)  msg.push(`${okCount} agregada${okCount !== 1 ? 's' : ''}`);
    if (dupCount) msg.push(`${dupCount} repetida${dupCount !== 1 ? 's' : ''}`);
    if (errCount) msg.push(`${errCount} sin datos`);
    toast('✅ ' + (msg.length ? msg.join(' · ') : 'sin novedades'));
  } catch (e) {
    prog.classList.remove('show');
    toast('Error: no se pudo iniciar el lector');
  } finally {
    procesando = false;
  }
}

function parsearCaptura(texto) {
  const out = { apellido: '', nombre: '', dni: '', domicilio: '', codigo_dic: '', sexo: '', nacimiento: '' };
  if (!texto) return out;

  const lineas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

  // Apellido: línea siguiente a "Apellido"
  for (let i = 0; i < lineas.length - 1; i++) {
    if (/^apellido\s*:?\s*$/i.test(lineas[i])) {
      out.apellido = lineas[i + 1].replace(/[^\wÁÉÍÓÚÑ\s]/gi, ' ').trim();
      break;
    }
  }
  // Fallback inline "Apellido: LAMAS"
  if (!out.apellido) {
    const m = texto.match(/Apellido\s*[:\-]?\s*([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s]{1,40})/);
    if (m) out.apellido = m[1].trim();
  }

  // Nombre
  for (let i = 0; i < lineas.length - 1; i++) {
    if (/^nombre\s*:?\s*$/i.test(lineas[i])) {
      out.nombre = lineas[i + 1].replace(/[^\wÁÉÍÓÚÑ\s]/gi, ' ').trim();
      break;
    }
  }
  if (!out.nombre) {
    const m = texto.match(/Nombre\s*[:\-]?\s*([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s]{1,40})/);
    if (m) out.nombre = m[1].trim();
  }

  // DNI: línea siguiente a "Documento" o regex por 8 dígitos
  for (let i = 0; i < lineas.length - 1; i++) {
    if (/^documento\s*:?\s*$/i.test(lineas[i])) {
      const d = lineas[i + 1].replace(/\./g, '').replace(/\D/g, '');
      if (/^\d{6,8}$/.test(d)) { out.dni = d; break; }
    }
  }
  if (!out.dni) {
    const m = texto.match(/Documento[^\d]{0,8}(\d[\d\.]{5,10})/i);
    if (m) out.dni = m[1].replace(/\./g, '');
  }
  if (!out.dni) {
    for (const l of lineas) {
      const m = l.match(/(?<!\d)(\d{7,8})(?!\d)/);
      if (m && !/^(19|20)\d{6}$/.test(m[1])) { out.dni = m[1]; break; }
    }
  }

  // Fecha nac + sexo (por si aparecen)
  const mFecha = texto.match(/(\d{2}\/\d{2}\/\d{4})/);
  if (mFecha) out.nacimiento = mFecha[1];
  const mSexo = texto.match(/\b([MF])\s+(?:ARG|NAC)/i) || texto.match(/Sexo\s*[:\-]?\s*([MF])/i);
  if (mSexo) out.sexo = mSexo[1].toUpperCase();

  // Domicilio: desde "Domicilio" hasta "CODIGO" o blank o siguiente etiqueta conocida
  const etiquetasFin = /^(DOCUMENTO|FECHA|EDAD|SEXO|NAC\.?|CODIGO|C[OÓ]DIGO|APELLIDO|NOMBRE|DNI|NUEVA|GOBIERNO|MINISTERIO|POLIC[IÍ]A|SIPS|SISTEMA)/i;
  for (let i = 0; i < lineas.length; i++) {
    if (/^domicilio\b/i.test(lineas[i]) || /domicilio\s*:?\s*$/i.test(lineas[i])) {
      const inline = lineas[i].replace(/^.*?domicilio[:\s]*/i, '').trim();
      const partes = [];
      if (inline && !/^domicilio$/i.test(inline)) partes.push(inline);
      for (let j = i + 1; j < lineas.length; j++) {
        if (/c[oó]digo/i.test(lineas[j])) break;
        if (etiquetasFin.test(lineas[j])) break;
        partes.push(lineas[j]);
        if (partes.join(' ').length > 150) break;
      }
      if (partes.length) {
        out.domicilio = partes.join(' ')
          .replace(/\s+/g, ' ')
          .replace(/\s*N[°º]\s*/i, ' N° ')
          .trim();
        break;
      }
    }
  }

  // Código: AZUL/NEGRO/BLANCO/ROJO
  const mCod = texto.match(/C[OÓ]DIGO\s*[:\-]?\s*(AZUL|NEGRO|BLANCO|ROJO)/i);
  if (mCod) out.codigo_dic = mCod[1].toUpperCase();

  return out;
}

/* ══════════════ RENDER ══════════════ */
function renderTodo() {
  renderLista();
  renderMensajePersonas();
  renderContador();
  guardarPersonas();
}

function renderContador() {
  const el = document.getElementById('contador');
  const total = personas.length;
  const completas = personas.filter(personaCompleta).length;
  const acc = document.getElementById('acciones-capturas');
  if (!total) {
    el.textContent = '';
    acc.style.display = 'none';
    return;
  }
  const faltan = total - completas;
  el.innerHTML = `<strong>${total}</strong> persona${total !== 1 ? 's' : ''} · ${completas} completa${completas !== 1 ? 's' : ''}${faltan ? ` · <span style="color:var(--warn)">${faltan} sin completar</span>` : ''}`;
  acc.style.display = 'grid';
}

function renderLista() {
  const cont = document.getElementById('lista-personas');
  if (!personas.length) {
    cont.innerHTML = `<div class="empty-state"><div class="empty-icon">📷</div>Cargá una captura del sistema<br>para empezar</div>`;
    return;
  }
  cont.innerHTML = personas.map((p, i) => {
    const completa = personaCompleta(p);
    const cod = p.codigo_dic || '';
    const nombre = `${p.apellido}${p.nombre ? ', ' + p.nombre : ''}`.trim() || '(sin nombre)';
    return `
    <div class="persona ${completa?'':'incompleta'}" id="per-${i}">
      <div class="p-head">
        <div style="flex:1;min-width:0">
          <div class="p-name">${esc(nombre)}</div>
          <div class="p-dni">
            ${p.dni ? 'DNI ' + esc(p.dni) : ''}
            ${p.dni && p.sexo ? ' · ' : ''}${p.sexo ? esc(p.sexo) : ''}
            ${completa
              ? ' <span class="p-badge-ok">✅</span>'
              : ' <span class="p-badge-falta">⚠️ falta completar</span>'}
          </div>
        </div>
        <button class="p-del" onclick="borrarPersona(${i})" title="Quitar">✕</button>
      </div>
      <div class="p-row">
        <div class="p-field">
          <label>Apellido</label>
          <input type="text" value="${esc(p.apellido)}" oninput="editar(${i},'apellido',this.value)">
        </div>
        <div class="p-field">
          <label>Nombre</label>
          <input type="text" value="${esc(p.nombre)}" oninput="editar(${i},'nombre',this.value)">
        </div>
      </div>
      <div class="p-row">
        <div class="p-field">
          <label>DNI</label>
          <input type="text" value="${esc(p.dni)}" oninput="editar(${i},'dni',this.value)" inputmode="numeric">
        </div>
        <div class="p-field">
          <label>Código</label>
          <select onchange="editar(${i},'codigo_dic',this.value)">
            <option value="" ${!cod?'selected':''}>— sin código —</option>
            <option value="AZUL"   ${cod==='AZUL'?'selected':''}>AZUL</option>
            <option value="NEGRO"  ${cod==='NEGRO'?'selected':''}>NEGRO</option>
            <option value="BLANCO" ${cod==='BLANCO'?'selected':''}>BLANCO</option>
            <option value="ROJO"   ${cod==='ROJO'?'selected':''}>ROJO</option>
          </select>
        </div>
      </div>
      <div class="p-field">
        <label>Domicilio</label>
        <input type="text" value="${esc(p.domicilio)}" placeholder="Calle N°, Barrio, Localidad"
               oninput="editar(${i},'domicilio',this.value)">
      </div>
    </div>`;
  }).join('');
}

function editar(idx, campo, valor) {
  if (!personas[idx]) return;
  personas[idx][campo] = valor;
  guardarPersonas();

  // Refrescar solo el header de esa persona sin perder el foco
  const item = document.getElementById(`per-${idx}`);
  if (!item) return;
  const p = personas[idx];
  const completa = personaCompleta(p);
  item.classList.toggle('incompleta', !completa);

  const nameEl = item.querySelector('.p-name');
  if (nameEl && (campo === 'apellido' || campo === 'nombre')) {
    const nombre = `${p.apellido}${p.nombre ? ', ' + p.nombre : ''}`.trim() || '(sin nombre)';
    nameEl.textContent = nombre;
  }
  const dniEl = item.querySelector('.p-dni');
  if (dniEl && (campo === 'dni' || campo === 'sexo' || campo === 'codigo_dic' || campo === 'domicilio' || campo === 'apellido' || campo === 'nombre')) {
    dniEl.innerHTML = `
      ${p.dni ? 'DNI ' + esc(p.dni) : ''}
      ${p.dni && p.sexo ? ' · ' : ''}${p.sexo ? esc(p.sexo) : ''}
      ${completa
        ? ' <span class="p-badge-ok">✅</span>'
        : ' <span class="p-badge-falta">⚠️ falta completar</span>'}`;
  }
  renderContador();
  renderMensajePersonas();
}

function borrarPersona(idx) {
  personas.splice(idx, 1);
  renderTodo();
  toast('Persona eliminada');
}

function borrarTodas() {
  if (!personas.length) return;
  if (!confirm('¿Borrar todas las personas cargadas?')) return;
  personas = [];
  renderTodo();
  toast('Listado vacío');
}

/* ══════════════ MENSAJE ══════════════ */
function renderMensajePersonas() {
  const cont = document.getElementById('msg-personas');
  const cnt = document.getElementById('msg-count');
  const total = personas.length;
  cnt.textContent = total ? `(${total})` : '(vacío)';

  if (!total) {
    cont.innerHTML = `<div class="empty-state"><div class="empty-icon">👤</div>Agregá capturas para ver personas acá</div>`;
    return;
  }

  cont.innerHTML = personas.map((p, i) => {
    const completa = personaCompleta(p);
    const nom = `${p.apellido} ${p.nombre}`.trim() || '(sin nombre)';
    return `
    <div class="persona ${completa?'':'incompleta'}" style="margin-bottom:10px">
      <div class="p-head">
        <div style="flex:1;min-width:0">
          <div class="p-name">${esc(nom)}</div>
          <div class="p-dni">
            DNI ${esc(p.dni) || '—'}
            ${completa ? ' <span class="p-badge-ok">✅</span>' : ' <span class="p-badge-falta">⚠️</span>'}
          </div>
        </div>
        <button class="p-del" onclick="borrarPersona(${i})">✕</button>
      </div>
      <div class="p-field">
        <label>Domicilio</label>
        <input type="text" value="${esc(p.domicilio)}" placeholder="Calle N°, Barrio, Localidad"
               oninput="editar(${i},'domicilio',this.value)">
      </div>
      <div class="p-field">
        <label>Código</label>
        <select onchange="editar(${i},'codigo_dic',this.value)">
          <option value="" ${!p.codigo_dic?'selected':''}>— sin código —</option>
          <option value="AZUL"   ${p.codigo_dic==='AZUL'?'selected':''}>AZUL</option>
          <option value="NEGRO"  ${p.codigo_dic==='NEGRO'?'selected':''}>NEGRO</option>
          <option value="BLANCO" ${p.codigo_dic==='BLANCO'?'selected':''}>BLANCO</option>
          <option value="ROJO"   ${p.codigo_dic==='ROJO'?'selected':''}>ROJO</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function armarMensaje() {
  const head = document.getElementById('msg-head').value.trim();
  const foot = document.getElementById('msg-foot').value.trim();

  const lista = personas.map(p => {
    const nombre = `${p.apellido || ''} ${p.nombre || ''}`.trim() || '(sin nombre)';
    const dom = (p.domicilio || '').trim() || 'no existe registros';
    const cod = (p.codigo_dic || '').trim() || '—';
    return [
      nombre,
      `DNI ${p.dni || '—'}`,
      `Dlio ${dom}`,
      `Código ${cod}`
    ].join('\n');
  }).join('\n\n');

  const partes = [head];
  if (lista) partes.push(lista);
  if (foot) partes.push(foot);
  return partes.filter(Boolean).join('\n\n');
}

function copiarMensaje() {
  if (!personas.length) { toast('No hay personas cargadas'); return; }
  const txt = armarMensaje();
  navigator.clipboard.writeText(txt)
    .then(() => toast('Mensaje copiado al portapapeles'))
    .catch(() => toast('No se pudo copiar'));
}

function verPreview() {
  const box = document.getElementById('msg-preview');
  const pre = document.getElementById('preview-box');
  pre.textContent = armarMensaje() || '(vacío)';
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

function irAMensaje() { switchTab('mensaje'); }

/* ══════════════ TABS ══════════════ */
function switchTab(tab) {
  ['capturas', 'mensaje'].forEach(t => {
    document.getElementById(`panel-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'mensaje') renderMensajePersonas();
}

/* ══════════════ TOAST ══════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2800);
}

/* ══════════════ INIT ══════════════ */
(function init() {
  personas = cargarPersonas();

  const head = document.getElementById('msg-head');
  const foot = document.getElementById('msg-foot');
  head.value = localStorage.getItem(HEAD_KEY) || DEFAULT_HEAD;
  foot.value = localStorage.getItem(FOOT_KEY) || DEFAULT_FOOT;
  head.addEventListener('input', () => localStorage.setItem(HEAD_KEY, head.value));
  foot.addEventListener('input', () => localStorage.setItem(FOOT_KEY, foot.value));

  // Drag & drop
  const zone = document.getElementById('upload-zone');
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => {
    e.preventDefault(); zone.classList.remove('dragover');
  }));
  zone.addEventListener('drop', e => {
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
    if (files.length) procesarArchivos(files);
  });

  renderTodo();
})();
</script>
</body>
</html>
