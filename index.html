<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escáner DNI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2333; --border:#30363d;
    --accent:#2563eb; --accent-light:#3b82f6; --success:#16a34a;
    --text:#e6edf3; --text-muted:#7d8590; --danger:#dc2626; --warn:#d97706;
    --font:'Segoe UI', system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;display:flex;flex-direction:column}

  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  header .badge{background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:20px;text-transform:uppercase}
  header h1{font-size:16px;font-weight:600;flex:1}

  main{flex:1;padding:20px 16px;max-width:480px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}

  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
  .tab-btn{background:none;border:none;color:var(--text-muted);font-size:11px;font-family:var(--font);font-weight:500;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:background .15s,color .15s}
  .tab-btn .icon{font-size:16px}
  .tab-btn.active{background:var(--accent);color:#fff}
  .tab-btn:not(.active):hover{background:var(--surface2);color:var(--text)}

  .panel{display:none;flex-direction:column;gap:14px}
  .panel.active{display:flex}

  .session-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px}
  .session-bar .s-label{font-size:12px;color:var(--text-muted);white-space:nowrap}
  .session-bar .s-label strong{color:var(--text)}
  .dots{display:flex;gap:5px;flex:1;overflow:hidden}
  .dot{width:100%;height:6px;border-radius:3px;background:var(--border);transition:background .2s}
  .dot.filled{background:var(--success)}
  .dot.current{background:var(--accent);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

  .config-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px}
  .config-row label{font-size:12px;color:var(--text-muted);flex:1}
  .config-row input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:14px;font-weight:600;padding:6px 10px;width:70px;text-align:center;outline:none}
  .config-row input:focus{border-color:var(--accent-light)}

  .scanner-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  #reader{width:100%}
  #reader video{border-radius:0!important}
  .scan-hint{text-align:center;color:var(--text-muted);font-size:13px;padding:8px}

  .session-list{display:flex;flex-direction:column;gap:8px}
  .session-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--success);border-radius:10px;overflow:hidden;animation:slideIn .25s ease}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .session-item.nuevo{border-left-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.25)}

  .si-header{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
  .si-num{background:var(--success);color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .session-item.nuevo .si-num{background:var(--accent)}
  .si-info{flex:1;min-width:0}
  .si-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .si-meta{font-size:11px;color:var(--text-muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
  .si-toggle{color:var(--text-muted);font-size:13px;flex-shrink:0;transition:transform .2s}
  .si-toggle.open{transform:rotate(180deg)}
  .si-del{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:2px 6px;flex-shrink:0}
  .si-del:hover{color:var(--danger)}

  .si-datos{border-top:1px solid var(--border);padding:12px;display:none;flex-direction:column;gap:8px;background:var(--surface2)}
  .si-datos.open{display:flex}
  .si-field{display:flex;flex-direction:column;gap:1px}
  .si-field label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted)}
  .si-field span{font-size:14px;font-weight:500;word-break:break-word}
  .si-field input{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;padding:6px 8px;width:100%;outline:none;margin-top:2px}
  .si-field input:focus{border-color:var(--accent-light)}
  .si-field select{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:13px;padding:6px 8px;width:100%;outline:none;margin-top:2px}
  .si-field-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .si-field-row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .si-actions{display:flex;gap:8px;margin-top:4px}
  .si-copy-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:11px;font-weight:600;padding:5px 12px;cursor:pointer;flex:1}
  .si-copy-btn:hover{background:var(--border)}
  .si-copy-btn.del{color:var(--danger)}

  .btn{width:100%;padding:13px;border-radius:10px;border:none;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-light)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-success{background:var(--success);color:#fff}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{background:var(--surface2)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .action-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-size:12px;font-weight:600;color:var(--text-muted)}
  .form-group input, .form-group textarea, .form-group select{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;padding:10px 12px;width:100%;outline:none;transition:border-color .15s}
  .form-group textarea{font-size:13px;line-height:1.4;resize:vertical;min-height:60px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus{border-color:var(--accent-light)}
  .form-group input::placeholder, .form-group textarea::placeholder{color:var(--text-muted)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .saved-list{display:flex;flex-direction:column;gap:10px}
  .saved-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
  .saved-item .s-name{font-size:14px;font-weight:600;word-break:break-word}
  .saved-item .s-meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap}
  .saved-item .s-actions{display:flex;gap:8px;margin-top:6px}
  .mini-btn{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font);font-size:11px;font-weight:600;padding:4px 10px;cursor:pointer}
  .mini-btn:hover{background:var(--border)}
  .mini-btn.del{color:var(--danger)}

  .empty-state{text-align:center;color:var(--text-muted);font-size:14px;padding:30px 0}
  .empty-state .empty-icon{font-size:36px;margin-bottom:10px}

  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;white-space:nowrap;z-index:100;transition:transform .25s ease;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted)}

  .msg-person{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .msg-person .mp-header{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .msg-person .mp-name{font-size:13px;font-weight:600}
  .msg-person .mp-dni{font-size:11px;color:var(--text-muted)}

  .preview-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--text-muted);max-height:220px;overflow:auto}

  #reader__scan_region{background:transparent!important}
  #reader__dashboard{background:var(--surface)!important;color:var(--text-muted)!important;border-top:1px solid var(--border)!important}
  #reader__dashboard_section_swaplink{color:var(--accent-light)!important}
</style>
</head>
<body>

<header>
  <span class="badge">DNI AR</span>
  <h1>Escáner de Documentos</h1>
</header>

<main>
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('scan')" id="tab-scan"><span class="icon">📷</span>Escanear</button>
    <button class="tab-btn" onclick="switchTab('manual')" id="tab-manual"><span class="icon">✏️</span>Manual</button>
    <button class="tab-btn" onclick="switchTab('mensaje')" id="tab-mensaje"><span class="icon">📝</span>Mensaje</button>
    <button class="tab-btn" onclick="switchTab('saved')" id="tab-saved"><span class="icon">📋</span>Guardados</button>
  </div>

  <!-- ═══ SCAN ═══ -->
  <div class="panel active" id="panel-scan">
    <div class="config-row" id="cfg-row">
      <label for="cfg-max">Límite por sesión</label>
      <input type="number" id="cfg-max" min="1" max="100" value="8" inputmode="numeric">
    </div>

    <div class="session-bar" id="session-bar" style="display:none">
      <div class="s-label">DNI <strong id="s-count">0</strong> / <span id="s-max">8</span></div>
      <div class="dots" id="s-dots"></div>
    </div>

    <div class="scanner-box"><div id="reader"></div></div>
    <p class="scan-hint" id="scan-hint">Configurá el límite e iniciá la sesión para escanear</p>

    <div id="cam-controls">
      <button class="btn btn-primary" id="btn-start" onclick="startSesion()">Iniciar sesión de escaneo</button>
      <button class="btn btn-danger"  id="btn-stop"  onclick="pausarCamara()" style="display:none">Pausar cámara</button>
      <button class="btn btn-primary" id="btn-resume" onclick="reanudarCamara()" style="display:none">Continuar escaneando</button>
    </div>

    <div id="session-section" style="display:none">
      <p class="section-title" style="margin-bottom:8px">DNI escaneados en esta sesión</p>
      <div class="session-list" id="session-list"></div>
      <div class="action-row-3" style="margin-top:4px">
        <button class="btn btn-success" onclick="guardarSesion()">Guardar todos</button>
        <button class="btn btn-outline" onclick="irAMensaje()">Ir a Mensaje</button>
        <button class="btn btn-danger"  onclick="limpiarSesion()" style="font-size:12px">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- ═══ MANUAL ═══ -->
  <div class="panel" id="panel-manual">
    <p class="section-title">Datos del DNI</p>
    <div class="form-group"><label>Apellido</label><input type="text" id="m-apellido" placeholder="GARCIA" autocomplete="off"></div>
    <div class="form-group"><label>Nombre/s</label><input type="text" id="m-nombre" placeholder="JUAN PABLO" autocomplete="off"></div>
    <div class="form-row">
      <div class="form-group"><label>N° DNI</label><input type="text" id="m-dni" placeholder="12345678" inputmode="numeric"></div>
      <div class="form-group"><label>Sexo</label><input type="text" id="m-sexo" placeholder="M / F" maxlength="1"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Fecha Nacimiento</label><input type="text" id="m-nac" placeholder="01/01/1990"></div>
      <div class="form-group"><label>Fecha Vencimiento</label><input type="text" id="m-venc" placeholder="01/01/2030"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Ejemplar</label><input type="text" id="m-ejemplar" placeholder="00001" inputmode="numeric"></div>
      <div class="form-group"><label>Código de trámite</label><input type="text" id="m-codigo" placeholder="00000000000" inputmode="numeric"></div>
    </div>
    <div class="form-group"><label>Domicilio</label><input type="text" id="m-domicilio" placeholder="AV. BELGRANO 1234" autocomplete="off"></div>
    <div class="form-row">
      <div class="form-group"><label>Localidad</label><input type="text" id="m-localidad" placeholder="SALTA" autocomplete="off"></div>
      <div class="form-group"><label>Provincia</label><input type="text" id="m-provincia" placeholder="SALTA" autocomplete="off"></div>
    </div>
    <div class="form-group"><label>Cuil / Cuit</label><input type="text" id="m-cuil" placeholder="20-12345678-9" inputmode="numeric"></div>
    <button class="btn btn-primary" onclick="guardarManual()">Agregar a sesión</button>
  </div>

  <!-- ═══ MENSAJE ═══ -->
  <div class="panel" id="panel-mensaje">
    <p class="section-title">Encabezado</p>
    <div class="form-group">
      <textarea id="msg-head" rows="14" placeholder="Escribí el encabezado del mensaje..."></textarea>
    </div>

    <p class="section-title">Personas identificadas <span id="msg-count" style="color:var(--accent-light)"></span></p>
    <div id="msg-personas"></div>

    <p class="section-title">Pie / Informante</p>
    <div class="form-group">
      <textarea id="msg-foot" rows="3" placeholder="Escribí el pie del mensaje..."></textarea>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" onclick="copiarMensaje()">Copiar mensaje</button>
      <button class="btn btn-outline" onclick="verPreview()">Previsualizar</button>
    </div>

    <div id="msg-preview" style="display:none">
      <p class="section-title" style="margin-bottom:6px">Vista previa</p>
      <div class="preview-box" id="preview-box"></div>
    </div>
  </div>

  <!-- ═══ SAVED ═══ -->
  <div class="panel" id="panel-saved">
    <div class="action-row">
      <button class="btn btn-outline" onclick="exportarTodos()">Exportar todo</button>
      <button class="btn btn-danger"  onclick="borrarTodos()" style="font-size:13px">Borrar todo</button>
    </div>
    <div class="saved-list" id="saved-list"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ══════════════ ESTADO GLOBAL ══════════════ */
const DEFAULT_MAX = 8;
const STORAGE_KEY = 'dni_registros';
const MAX_KEY     = 'dni_max';
const HEAD_KEY    = 'msg_head';
const FOOT_KEY    = 'msg_foot';

const DEFAULT_HEAD = `📢 *DIV. INTERVENCIÓN CIUDADANA 1 (DIC)*

*FECHA:* 
*HORA:*   

*JEFE DPTO. INTERVENCION CIUDADANA (DIC 1)* 
//

*JEFE DIV. INTERVENCION CIUDADANA 1 (DIC):*
Crío Jael Bonavota 

*OFICIAL DE SERVICIO:*
//

*JEFE DE TERCIO:*
Sgto Ayte. Fiscina Matías 

*PUNTO ASIGNADO:*
Móvil 2354 Cría 5ta 

*RECURSO DIC1:*
Chófer 
Sop Alemán Roberto (DIC1) 
Custodio 
Sgto Guaymas Emanuel (DIC-1)
Refuerzo 
Agte Ovando Eugenia (DIC-1)

*NOVEDADES* 
Informo que se realizó identificación de Persona con el siguiente resultado 
`;

const DEFAULT_FOOT = `*INFORMANTE:* 
Sgto Guaymas Emanuel (DIC-1)`;

let html5QrCode   = null;
let scanning      = false;
let sesionActiva  = false;
let sesionDNI     = [];
let cooldown      = false;

/* ══════════════ UTILIDADES ══════════════ */
function limpiar(str) { return (str || '').toString().trim().replace(/\s+/g, ' '); }

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function getMax() {
  const v = parseInt(document.getElementById('cfg-max').value, 10);
  if (Number.isFinite(v) && v >= 1 && v <= 100) return v;
  return DEFAULT_MAX;
}

/* ══════════════ PARSER ══════════════ */
function parsearDNI(texto) {
  let t = (texto || '').trim();
  if (!t) return null;

  let partes;
  if (t.includes('@')) partes = t.split('@');
  else if (t.includes('\t')) partes = t.split('\t');
  else return null;

  partes = partes.map(x => x.trim());
  while (partes.length && partes[0] === '') partes.shift();
  while (partes.length && partes[partes.length - 1] === '') partes.pop();
  if (partes.length < 4) return null;

  const dniIdx = partes.findIndex(x => /^\d{6,8}$/.test(x.replace(/\./g, '')));
  if (dniIdx === -1) return null;
  const dni = partes[dniIdx].replace(/\./g, '');

  const esSexo = x => /^[MFmf]$/.test((x || '').trim());

  let apellido = '', nombre = '', sexo = '', ejemplar = '',
      nacimiento = '', vencimiento = '', codigo = '';

  if (dniIdx >= 3 && esSexo(partes[dniIdx - 1])) {
    apellido    = partes[dniIdx - 3];
    nombre      = partes[dniIdx - 2];
    sexo        = partes[dniIdx - 1].toUpperCase();
    ejemplar    = partes[dniIdx + 1] || '';
    nacimiento  = partes[dniIdx + 2] || '';
    vencimiento = partes[dniIdx + 3] || '';
    codigo      = partes[dniIdx + 4] || '';
  } else if (esSexo(partes[dniIdx + 1])) {
    apellido    = partes[dniIdx - 2] || '';
    nombre      = partes[dniIdx - 1] || '';
    sexo        = partes[dniIdx + 1].toUpperCase();
    nacimiento  = partes[dniIdx + 2] || '';
    vencimiento = partes[dniIdx + 3] || '';
    ejemplar    = partes[dniIdx + 4] || '';
    codigo      = partes[dniIdx + 5] || '';
  } else {
    apellido    = partes[dniIdx - 3] || partes[dniIdx - 2] || partes[0] || '';
    nombre      = partes[dniIdx - 2] || partes[dniIdx - 1] || partes[1] || '';
    ejemplar    = partes[dniIdx + 1] || '';
    nacimiento  = partes[dniIdx + 2] || '';
    vencimiento = partes[dniIdx + 3] || '';
  }

  if (!codigo && partes[0] && /^\d{10,}$/.test(partes[0])) codigo = partes[0];

  if (!apellido && !nombre) return null;

  const fuente = t.includes('@') ? 'QR' : 'PDF417';

  return {
    apellido: limpiar(apellido),
    nombre:   limpiar(nombre),
    sexo, dni,
    ejemplar:    limpiar(ejemplar),
    nacimiento:  limpiar(nacimiento),
    vencimiento: limpiar(vencimiento),
    codigo:      limpiar(codigo),
    domicilio:   '',
    codigo_dic:  '',
    nacionalidad: '', lugar: '', localidad: '', provincia: '', cuil: '',
    fuente, ts: new Date().toISOString()
  };
}

/* ══════════════ CONTROL DE BOTONES ══════════════ */
function refrescarControles() {
  const completo = sesionDNI.length >= getMax();
  document.getElementById('btn-start').style.display  = (!sesionActiva) ? 'block' : 'none';
  document.getElementById('btn-stop').style.display   = (sesionActiva && scanning) ? 'block' : 'none';
  document.getElementById('btn-resume').style.display = (sesionActiva && !scanning && !completo) ? 'block' : 'none';
  document.getElementById('cfg-row').style.display    = sesionActiva ? 'none' : 'flex';
}

/* ══════════════ SESIÓN ══════════════ */
function startSesion() {
  sesionDNI = [];
  sesionActiva = true;
  cooldown = false;
  renderSessionBar();
  document.getElementById('session-bar').style.display = 'flex';
  document.getElementById('session-section').style.display = 'none';
  iniciarCamara();
}

function iniciarCamara() {
  if (html5QrCode) {
    try { html5QrCode.clear(); } catch (e) {}
    html5QrCode = null;
  }
  html5QrCode = new Html5Qrcode('reader');
  const config = { fps: 10, qrbox: { width: 240, height: 240 }, aspectRatio: 1.0 };
  const formats = { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.PDF_417] };

  Html5Qrcode.getCameras()
    .then(cams => {
      const cam = cams.find(c => /back|rear|environment/i.test(c.label)) || cams[cams.length - 1];
      return html5QrCode.start({ deviceId: { exact: cam.id } }, { ...config, ...formats }, onQRSuccess, () => {});
    })
    .catch(() => {
      return html5QrCode.start({ facingMode: 'environment' }, { ...config, ...formats }, onQRSuccess, () => {});
    })
    .then(() => { scanning = true; refrescarControles(); actualizarHint(); })
    .catch(() => { scanning = false; refrescarControles(); toast('No se pudo iniciar la cámara'); });
}

function pausarCamara() {
  if (!html5QrCode || !scanning) { scanning = false; refrescarControles(); return Promise.resolve(); }
  return html5QrCode.stop()
    .catch(() => {})
    .then(() => { scanning = false; refrescarControles(); renderSessionBar(); });
}

function reanudarCamara() {
  if (sesionDNI.length >= getMax()) { toast(`Límite de ${getMax()} DNI alcanzado`); return; }
  iniciarCamara();
}

function onQRSuccess(decodedText) {
  if (cooldown) return;

  const datos = parsearDNI(decodedText);
  if (!datos) { toast('Código no reconocido como DNI'); return; }

  if (sesionDNI.some(d => d.dni === datos.dni)) { toast(`DNI ${datos.dni} ya escaneado`); return; }

  cooldown = true;
  setTimeout(() => { cooldown = false; }, 2000);

  const nuevoIdx = sesionDNI.length;
  sesionDNI.push(datos);
  renderSessionBar();
  renderSessionList(nuevoIdx);
  document.getElementById('session-section').style.display = 'block';

  setTimeout(() => {
    const el = document.getElementById(`si-${nuevoIdx}`);
    if (el) el.classList.remove('nuevo');
    const num = el && el.querySelector('.si-num');
    if (num) num.style.background = 'var(--success)';
  }, 3000);

  const max = getMax();
  if (sesionDNI.length >= max) {
    pausarCamara().then(() => toast(`✅ ${max} DNI completados`));
  } else {
    toast(`DNI ${sesionDNI.length} de ${max} leído`);
  }
  actualizarHint();
}

function actualizarHint() {
  const h = document.getElementById('scan-hint');
  const max = getMax();
  if (!sesionActiva) {
    h.textContent = `Configurá el límite e iniciá la sesión para escanear hasta ${max} DNI`;
  } else if (sesionDNI.length >= max) {
    h.textContent = `Límite de ${max} DNI alcanzado. Guardá o copiá los datos.`;
  } else {
    h.textContent = `Apuntá al QR del DNI. Próximo: ${sesionDNI.length + 1} de ${max}`;
  }
}

function renderSessionBar() {
  const max = getMax();
  document.getElementById('s-count').textContent = sesionDNI.length;
  document.getElementById('s-max').textContent   = max;
  const dotsEl = document.getElementById('s-dots');
  dotsEl.innerHTML = Array.from({ length: max }, (_, i) => {
    let cls = 'dot';
    if (i < sesionDNI.length) cls += ' filled';
    else if (i === sesionDNI.length && scanning) cls += ' current';
    return `<div class="${cls}"></div>`;
  }).join('');
}

function renderSessionList(nuevoIdx = -1) {
  const cont = document.getElementById('session-list');
  if (!sesionDNI.length) { cont.innerHTML = ''; return; }
  cont.innerHTML = sesionDNI.map((d, i) => {
    const esNuevo = i === nuevoIdx;
    const id = `si-datos-${i}`;
    const cod = d.codigo_dic || '';
    return `
    <div class="session-item ${esNuevo ? 'nuevo' : ''}" id="si-${i}">
      <div class="si-header" onclick="toggleDatos(${i})">
        <div class="si-num">${i + 1}</div>
        <div class="si-info">
          <div class="si-name">${esc(d.apellido)}, ${esc(d.nombre)}</div>
          <div class="si-meta">
            <span>DNI ${esc(d.dni)}</span>
            ${d.sexo ? `<span>${esc(d.sexo)}</span>` : ''}
            ${cod ? `<span style="color:var(--warn);font-weight:600">${esc(cod)}</span>` : ''}
            <span style="background:var(--surface2);border:1px solid var(--border);border-radius:3px;font-size:10px;padding:0 4px">${esc(d.fuente)}</span>
          </div>
        </div>
        <span class="si-toggle ${esNuevo ? 'open' : ''}" id="toggle-${i}">▼</span>
        <button class="si-del" onclick="event.stopPropagation(); quitarDeSesion(${i})" title="Quitar">✕</button>
      </div>
      <div class="si-datos ${esNuevo ? 'open' : ''}" id="${id}">
        <div class="si-field-row">
          <div class="si-field"><label>Apellido</label><span>${esc(d.apellido) || '—'}</span></div>
          <div class="si-field" style="grid-column:span 2"><label>Nombre/s</label><span>${esc(d.nombre) || '—'}</span></div>
        </div>
        <div class="si-field-row">
          <div class="si-field"><label>DNI N°</label><span>${esc(d.dni) || '—'}</span></div>
          <div class="si-field"><label>Sexo</label><span>${esc(d.sexo) || '—'}</span></div>
          <div class="si-field"><label>Ejemplar</label><span>${esc(d.ejemplar) || '—'}</span></div>
        </div>
        <div class="si-field-row">
          <div class="si-field"><label>Nacimiento</label><span>${esc(d.nacimiento) || '—'}</span></div>
          <div class="si-field"><label>Vencimiento</label><span>${esc(d.vencimiento) || '—'}</span></div>
          <div class="si-field"><label>Fuente</label><span>${esc(d.fuente)}</span></div>
        </div>

        <div class="si-field">
          <label>Domicilio (para el mensaje)</label>
          <input type="text" id="dom-${i}" value="${esc(d.domicilio || '')}"
                 placeholder="Calle N°, Barrio, Localidad"
                 oninput="setDomicilio(${i}, this.value)">
        </div>
        <div class="si-field">
          <label>Código</label>
          <select id="cod-${i}" onchange="setCodigoDic(${i}, this.value)">
            <option value="" ${!cod?'selected':''}>— sin código —</option>
            <option value="AZUL"   ${cod==='AZUL'?'selected':''}>AZUL</option>
            <option value="NEGRO"  ${cod==='NEGRO'?'selected':''}>NEGRO</option>
            <option value="BLANCO" ${cod==='BLANCO'?'selected':''}>BLANCO</option>
            <option value="ROJO"   ${cod==='ROJO'?'selected':''}>ROJO</option>
          </select>
        </div>

        <div class="si-actions">
          <button class="si-copy-btn" onclick="copiarDeSesion(${i})">Copiar</button>
          <button class="si-copy-btn del" onclick="quitarDeSesion(${i})">Quitar</button>
        </div>
      </div>
    </div>`;
  }).join('');

  if (nuevoIdx >= 0) {
    setTimeout(() => {
      const el = document.getElementById(`si-${nuevoIdx}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function toggleDatos(i) {
  document.getElementById(`si-datos-${i}`).classList.toggle('open');
  document.getElementById(`toggle-${i}`).classList.toggle('open');
}

function setDomicilio(i, val) {
  if (sesionDNI[i]) sesionDNI[i].domicilio = val.trim().toUpperCase();
  renderMensajePersonas();
}
function setCodigoDic(i, val) {
  if (sesionDNI[i]) sesionDNI[i].codigo_dic = val;
  // refrescar sólo el badge de la lista (sin perder foco)
  const meta = document.querySelector(`#si-${i} .si-meta`);
  if (meta) {
    const spans = meta.querySelectorAll('span');
    // busca un span con color warn y actualiza/elimina
    let found = false;
    spans.forEach(s => {
      if (s.style.color === 'var(--warn)') {
        if (val) { s.textContent = val; found = true; }
        else s.remove();
      }
    });
    if (!found && val) {
      const s = document.createElement('span');
      s.style.color = 'var(--warn)';
      s.style.fontWeight = '600';
      s.textContent = val;
      meta.insertBefore(s, meta.children[2] || null);
    }
  }
  renderMensajePersonas();
}

function quitarDeSesion(idx) {
  sesionDNI.splice(idx, 1);
  renderSessionBar();
  renderSessionList();
  renderMensajePersonas();
  if (!sesionDNI.length) document.getElementById('session-section').style.display = 'none';
  refrescarControles();
  actualizarHint();
}

function guardarSesion() {
  if (!sesionDNI.length) { toast('No hay DNI en la sesión'); return; }
  const lista = cargarLista();
  const existentes = new Set(lista.map(d => d.dni));
  let nuevos = 0, repetidos = 0;
  sesionDNI.forEach(d => {
    if (existentes.has(d.dni)) { repetidos++; return; }
    lista.unshift(d); existentes.add(d.dni); nuevos++;
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
  toast(repetidos
    ? `${nuevos} guardados · ${repetidos} ya existían`
    : `${nuevos} DNI guardados`);
}

function copiarDeSesion(idx) {
  const d = sesionDNI[idx];
  if (d) copiarDatos(d);
}

function limpiarSesion() {
  sesionActiva = false;
  sesionDNI = [];
  cooldown = false;
  document.getElementById('session-bar').style.display = 'none';
  document.getElementById('session-section').style.display = 'none';
  renderMensajePersonas();

  const terminar = () => {
    scanning = false;
    if (html5QrCode) { try { html5QrCode.clear(); } catch (e) {} html5QrCode = null; }
    refrescarControles();
    actualizarHint();
  };

  if (html5QrCode && scanning) {
    html5QrCode.stop().catch(() => {}).then(terminar);
  } else {
    terminar();
  }
}

/* ══════════════ MANUAL ══════════════ */
function guardarManual() {
  const apellido = document.getElementById('m-apellido').value.trim();
  const nombre   = document.getElementById('m-nombre').value.trim();
  const dni      = document.getElementById('m-dni').value.trim();
  if (!apellido || !nombre || !dni) { toast('Completá apellido, nombre y DNI'); return; }

  const datos = {
    apellido, nombre,
    sexo:         document.getElementById('m-sexo').value.trim().toUpperCase(),
    dni,
    ejemplar:     document.getElementById('m-ejemplar').value.trim(),
    nacimiento:   document.getElementById('m-nac').value.trim(),
    vencimiento:  document.getElementById('m-venc').value.trim(),
    codigo:       document.getElementById('m-codigo').value.trim(),
    domicilio:    document.getElementById('m-domicilio').value.trim().toUpperCase(),
    localidad:    document.getElementById('m-localidad').value.trim().toUpperCase(),
    provincia:    document.getElementById('m-provincia').value.trim().toUpperCase(),
    cuil:         document.getElementById('m-cuil').value.trim(),
    codigo_dic:   '',
    nacionalidad: '', lugar: '',
    fuente: 'Manual',
    ts: new Date().toISOString()
  };

  if (sesionActiva && sesionDNI.length < getMax()) {
    if (sesionDNI.some(d => d.dni === datos.dni)) { toast('Ese DNI ya está en la sesión'); return; }
    sesionDNI.push(datos);
    renderSessionBar();
    renderSessionList();
    renderMensajePersonas();
    document.getElementById('session-section').style.display = 'block';
    switchTab('scan');
    toast('Agregado a la sesión actual');
  } else {
    const lista = cargarLista();
    if (lista.some(d => d.dni === datos.dni)) { toast('Ese DNI ya está guardado'); return; }
    lista.unshift(datos);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
    toast('Guardado correctamente');
  }

  ['m-apellido','m-nombre','m-sexo','m-dni','m-ejemplar','m-nac','m-venc',
   'm-codigo','m-domicilio','m-localidad','m-provincia','m-cuil']
    .forEach(id => document.getElementById(id).value = '');
}

/* ══════════════ STORAGE ══════════════ */
function cargarLista() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function borrarRegistro(idx) {
  const lista = cargarLista();
  lista.splice(idx, 1);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(lista));
  renderSaved();
  toast('Registro eliminado');
}

function borrarTodos() {
  if (!confirm('¿Borrar todos los registros guardados?')) return;
  localStorage.removeItem(STORAGE_KEY);
  renderSaved();
  toast('Registros eliminados');
}

function copiarGuardado(idx) {
  const d = cargarLista()[idx];
  if (d) copiarDatos(d);
}

function formatearDatos(datos) {
  const nom = `${datos.apellido || ''}, ${datos.nombre || ''}`.trim().replace(/,$/,'');
  return [
    nom,
    `DNI: ${datos.dni}`,
    datos.sexo        ? `SEXO: ${datos.sexo}` : '',
    datos.nacimiento  ? `NACIMIENTO: ${datos.nacimiento}` : '',
    datos.vencimiento ? `VENCIMIENTO: ${datos.vencimiento}` : '',
    datos.ejemplar    ? `EJEMPLAR: ${datos.ejemplar}` : '',
    datos.codigo      ? `CODIGO TRAMITE: ${datos.codigo}` : '',
    datos.domicilio   ? `DOMICILIO: ${datos.domicilio}` : '',
    datos.localidad   ? `LOCALIDAD: ${datos.localidad}` : '',
    datos.provincia   ? `PROVINCIA: ${datos.provincia}` : '',
    datos.cuil        ? `CUIL/CUIT: ${datos.cuil}` : '',
    datos.codigo_dic  ? `CODIGO: ${datos.codigo_dic}` : '',
  ].filter(Boolean).join('\n');
}

function copiarDatos(datos) {
  const txt = formatearDatos(datos);
  navigator.clipboard.writeText(txt)
    .then(() => toast('Datos copiados'))
    .catch(() => toast('No se pudo copiar'));
}

/* ══════════════ GUARDADOS ══════════════ */
function renderSaved() {
  const lista = cargarLista();
  const cont = document.getElementById('saved-list');
  if (!lista.length) {
    cont.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>No hay registros guardados</div>`;
    return;
  }
  cont.innerHTML = lista.map((d, i) => `
    <div class="saved-item">
      <div class="s-name">${esc(d.apellido)}, ${esc(d.nombre)}</div>
      <div class="s-meta">
        <span>DNI ${esc(d.dni)}</span>
        ${d.sexo ? `<span>${esc(d.sexo)}</span>` : ''}
        ${d.codigo_dic ? `<span style="color:var(--warn);font-weight:600">${esc(d.codigo_dic)}</span>` : ''}
        <span>${esc(d.fuente)}</span>
        <span>${new Date(d.ts).toLocaleDateString('es-AR')}</span>
      </div>
      ${d.domicilio ? `<div class="s-meta"><span>Dlio ${esc(d.domicilio)}</span></div>` : ''}
      <div class="s-actions">
        <button class="mini-btn" onclick="copiarGuardado(${i})">Copiar</button>
        <button class="mini-btn del" onclick="borrarRegistro(${i})">Eliminar</button>
      </div>
    </div>`).join('');
}

function exportarTodos() {
  const lista = cargarLista();
  if (!lista.length) { toast('No hay datos para exportar'); return; }
  const txt = lista.map((d, i) => [
    `[${i + 1}] ${d.apellido}, ${d.nombre}`,
    `DNI: ${d.dni} | Sexo: ${d.sexo} | Nac: ${d.nacimiento} | Venc: ${d.vencimiento}`,
    `Ejemplar: ${d.ejemplar} | Código trámite: ${d.codigo || '—'} | Fuente: ${d.fuente}`,
    d.domicilio  ? `Domicilio: ${d.domicilio}` : '',
    d.codigo_dic ? `Código: ${d.codigo_dic}` : '',
    d.cuil       ? `CUIL/CUIT: ${d.cuil}` : '',
    `Registro: ${new Date(d.ts).toLocaleString('es-AR')}`,
    ''
  ].filter(Boolean).join('\n')).join('\n');

  const blob = new Blob([txt], { type: 'text/plain' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = `registros_dni_${new Date().toISOString().slice(0, 10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ══════════════ MENSAJE ══════════════ */
function irAMensaje() {
  switchTab('mensaje');
}

function renderMensajePersonas() {
  const cont = document.getElementById('msg-personas');
  const cnt  = document.getElementById('msg-count');

  // Combina: personas de la sesión actual (editables) + guardadas (solo lectura mínima)
  const total = sesionDNI.length;
  cnt.textContent = total ? `(${total})` : '(vacío)';

  if (!total) {
    cont.innerHTML = `<div class="empty-state"><div class="empty-icon">👤</div>Escaneá o agregá personas para verlas acá</div>`;
    return;
  }

  cont.innerHTML = sesionDNI.map((d, i) => {
    const cod = d.codigo_dic || '';
    return `
    <div class="msg-person">
      <div class="mp-header">
        <div>
          <div class="mp-name">${esc(d.apellido)}, ${esc(d.nombre)}</div>
          <div class="mp-dni">DNI ${esc(d.dni)}</div>
        </div>
        <button class="mini-btn del" onclick="quitarDeSesion(${i})">Quitar</button>
      </div>
      <div class="si-field">
        <label>Domicilio</label>
        <input type="text" value="${esc(d.domicilio || '')}"
               placeholder="Calle N°, Barrio, Localidad"
               oninput="setDomicilio(${i}, this.value)">
      </div>
      <div class="si-field">
        <label>Código</label>
        <select onchange="setCodigoDic(${i}, this.value)">
          <option value="" ${!cod?'selected':''}>— sin código —</option>
          <option value="AZUL"   ${cod==='AZUL'?'selected':''}>AZUL</option>
          <option value="NEGRO"  ${cod==='NEGRO'?'selected':''}>NEGRO</option>
          <option value="BLANCO" ${cod==='BLANCO'?'selected':''}>BLANCO</option>
          <option value="ROJO"   ${cod==='ROJO'?'selected':''}>ROJO</option>
        </select>
      </div>
    </div>`;
  }).join('');
}

function armarMensaje() {
  const head = document.getElementById('msg-head').value.trim();
  const foot = document.getElementById('msg-foot').value.trim();

  const personas = sesionDNI.map(d => {
    const nombre = `${d.apellido || ''} ${d.nombre || ''}`.trim();
    const dom = (d.domicilio || '').trim() || 'no existe registros';
    const cod = (d.codigo_dic || '').trim() || '—';
    return [
      nombre,
      `DNI ${d.dni}`,
      `Dlio ${dom}`,
      `Código ${cod}`
    ].join('\n');
  }).join('\n\n');

  const partes = [head];
  if (personas) partes.push(personas);
  if (foot) partes.push(foot);
  return partes.filter(Boolean).join('\n\n');
}

function copiarMensaje() {
  if (!sesionDNI.length) { toast('No hay personas cargadas'); return; }
  const txt = armarMensaje();
  navigator.clipboard.writeText(txt)
    .then(() => toast('Mensaje copiado al portapapeles'))
    .catch(() => toast('No se pudo copiar'));
}

function verPreview() {
  const box = document.getElementById('msg-preview');
  const pre = document.getElementById('preview-box');
  pre.textContent = armarMensaje() || '(vacío)';
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

/* ══════════════ TABS ══════════════ */
function switchTab(tab) {
  ['scan', 'manual', 'mensaje', 'saved'].forEach(t => {
    document.getElementById(`panel-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'saved')   renderSaved();
  if (tab === 'mensaje') renderMensajePersonas();
}

/* ══════════════ TOAST ══════════════ */
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ══════════════ CONFIG PERSISTENTE ══════════════ */
(function initConfig() {
  const cfg = document.getElementById('cfg-max');
  const saved = parseInt(localStorage.getItem(MAX_KEY) || '', 10);
  if (Number.isFinite(saved) && saved >= 1 && saved <= 100) cfg.value = saved;

  const persist = () => {
    let v = parseInt(cfg.value, 10);
    if (!Number.isFinite(v) || v < 1) v = 1;
    if (v > 100) v = 100;
    cfg.value = v;
    localStorage.setItem(MAX_KEY, String(v));
    renderSessionBar();
    refrescarControles();
    actualizarHint();
  };
  cfg.addEventListener('change', persist);
  cfg.addEventListener('blur', persist);

  // Encabezado y pie persistentes
  const head = document.getElementById('msg-head');
  const foot = document.getElementById('msg-foot');
  head.value = localStorage.getItem(HEAD_KEY) || DEFAULT_HEAD;
  foot.value = localStorage.getItem(FOOT_KEY) || DEFAULT_FOOT;
  head.addEventListener('input', () => localStorage.setItem(HEAD_KEY, head.value));
  foot.addEventListener('input', () => localStorage.setItem(FOOT_KEY, foot.value));

  refrescarControles();
  actualizarHint();
  renderMensajePersonas();
})();
</script>
</body>
</html>
